name: Bump V10 service worker cache

on:
  push:
    branches:
      - release/v10-blue-gray-main

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('service-worker.js')
          text=p.read_text(encoding='utf-8').replace("minha-agenda-pro-v14","minha-agenda-pro-v15")
          p.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/bump-cache-v10.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add service-worker.js .github/workflows/bump-cache-v10.yml
          git commit -m 'chore: bump V10 service worker cache'
          git push
