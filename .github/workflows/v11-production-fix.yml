name: V11 production visual fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-v11:
    if: !contains(github.event.head_commit.message, 'apply V11 production theme')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject V11 stylesheet into production index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<link rel="stylesheet" href="./v11-theme.css?v=12">'
          if tag not in s:
              marker = '</head>'
              if marker not in s:
                  raise SystemExit('Missing </head> in index.html')
              s = s.replace(marker, '  ' + tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit V11 production theme
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: apply V11 production theme'
          git push
