<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3f8cff">
<title>Minha Agenda Pro • V9 Preview</title>
<style>
:root{--bg:#181d22;--panel:#1d252d;--panel2:#222b34;--line:rgba(167,183,201,.15);--text:#edf3f9;--muted:#95a3b2;--blue:#3f8cff;--blue2:#80b4ff;--danger:#ef4444;--warning:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,rgba(63,140,255,.09),transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,input{font:inherit}.app{display:flex;min-height:100vh}.side{width:230px;position:fixed;inset:0 auto 0 0;background:linear-gradient(180deg,#202830,#1b2229);border-right:1px solid var(--line);padding:22px 14px;z-index:5}.brand{font-weight:850;font-size:17px;padding:0 10px 24px}.brand b{color:var(--blue2)}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aab6c4;text-align:left;border-radius:10px;padding:11px 12px;cursor:pointer}.nav button:hover{background:rgba(255,255,255,.035);color:#fff}.nav button.active{background:linear-gradient(90deg,rgba(63,140,255,.15),rgba(63,140,255,.05));color:#8bbaff;box-shadow:inset 3px 0 var(--blue)}.main{margin-left:230px;width:calc(100% - 230px);padding:20px 24px}.top{height:52px;display:flex;align-items:center;gap:12px}.search{flex:1;max-width:520px;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:11px;padding:10px 13px;color:var(--text);outline:0}.search:focus{border-color:rgba(63,140,255,.55);box-shadow:0 0 0 3px rgba(63,140,255,.08)}.avatar{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;color:var(--blue2);font-weight:800}.hero{margin-top:16px;border:1px solid var(--line);border-radius:18px;padding:25px 28px;background:linear-gradient(135deg,rgba(63,140,255,.075),rgba(255,255,255,.012));box-shadow:0 14px 32px rgba(0,0,0,.12)}.hero h1{margin:0 0 7px;font-size:clamp(28px,3vw,40px);letter-spacing:-.04em}.hero p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.actions{display:flex;gap:8px;margin-top:18px}.btn{border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--text);border-radius:10px;padding:9px 13px;cursor:pointer;font-weight:760}.btn:hover{transform:translateY(-1px);border-color:rgba(128,180,255,.4)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 7px 18px rgba(63,140,255,.17)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);margin-top:16px;border-radius:16px;overflow:hidden}.stat{background:rgba(29,37,45,.96);padding:18px 20px}.stat b{display:block;font-size:25px;letter-spacing:-.03em}.stat span{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em}.calendar{margin-top:16px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#202933,#1c242c);overflow:hidden;box-shadow:0 18px 42px rgba(0,0,0,.18)}.calbar{min-height:58px;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.month{font-weight:820;letter-spacing:-.02em;margin-right:auto}.tabs{display:flex;gap:4px}.tab{border:0;background:transparent;color:#91a0af;padding:8px 11px;border-radius:9px;cursor:pointer}.tab.active{color:#8bbaff;background:rgba(63,140,255,.105)}.grid{display:grid;grid-template-columns:repeat(7,1fr)}.head{padding:12px 10px;text-align:center;color:#aab5c2;font-size:10px;font-weight:750;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.cell{min-height:132px;padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(255,255,255,.006)}.cell.today{background:rgba(63,140,255,.055)}.num{font-size:11px;font-weight:800;display:inline-grid;place-items:center;min-width:27px;height:27px;border-radius:9px}.today .num{background:var(--blue);color:#fff;box-shadow:0 5px 14px rgba(63,140,255,.24)}.event{margin-top:7px;padding:8px 9px;border:1px solid rgba(255,255,255,.075);border-left:3px solid var(--blue);border-radius:10px;background:linear-gradient(135deg,#202a35,#1b242d);box-shadow:0 7px 18px rgba(0,0,0,.18);cursor:pointer}.event:hover{border-color:rgba(128,180,255,.38);border-left-color:var(--blue2);transform:translateY(-1px)}.event strong{font-size:10px;display:block;line-height:1.3}.event small{display:block;color:var(--muted);font-size:9px;margin-top:4px}.toast{position:fixed;right:20px;bottom:20px;background:#202a35;border:1px solid rgba(63,140,255,.3);border-radius:12px;padding:12px 14px;box-shadow:0 18px 40px rgba(0,0,0,.28);display:none;font-size:11px}.toast.show{display:block}@media(max-width:900px){.side{width:76px}.brand{font-size:0}.brand b{font-size:17px}.nav button{font-size:0;text-align:center}.main{margin-left:76px;width:calc(100% - 76px);padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.cell{min-height:110px}}@media(max-width:620px){.main{margin-left:0;width:100%}.side{display:none}.stats{grid-template-columns:repeat(2,1fr)}.grid{min-width:720px}.calendar{overflow:auto}.hero{padding:20px}.top .search{max-width:none}.actions{flex-wrap:wrap}}
</style></head><body>
<div class="app"><aside class="side"><div class="brand">Minha <b>Agenda</b></div><nav class="nav"><button class="active">▦ &nbsp; Agenda</button><button>✓ &nbsp; Meu Dia</button><button>▤ &nbsp; Tarefas</button><button>▰ &nbsp; Pastas</button><button>⌕ &nbsp; Busca</button><button>✦ &nbsp; Assistente</button></nav></aside><main class="main"><header class="top"><input class="search" id="search" placeholder="Buscar na agenda..."><div class="avatar">A</div></header><section class="hero"><h1>Minha Agenda</h1><p>Organize seu dia com clareza, mantenha o foco e encontre tudo em um só lugar.</p><div class="actions"><button class="btn primary" id="newBtn">+ Nova tarefa</button><button class="btn" id="quickBtn">✦ Captura rápida</button></div></section><section class="stats"><div class="stat"><b>4</b><span>Hoje</span></div><div class="stat"><b>2</b><span>Concluídas</span></div><div class="stat"><b>1</b><span>Prioridade alta</span></div><div class="stat"><b>12</b><span>Esta semana</span></div></section><section class="calendar"><div class="calbar"><div class="month">Outubro 2026</div><div class="tabs"><button class="tab active">Mês</button><button class="tab">Semana</button><button class="tab">Dia</button></div></div><div class="grid" id="grid"></div></section></main></div><div class="toast" id="toast"></div>
<script>
const names=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];const events={5:[['08:30','Revisão de projetos'],['14:00','Reunião']],7:[['10:00','Estudo do dia']],12:[['09:00','Planejamento']],19:[['15:30','Acompanhamento']]};const grid=document.getElementById('grid');names.forEach(n=>{const e=document.createElement('div');e.className='head';e.textContent=n;grid.appendChild(e)});for(let d=1;d<=31;d++){const e=document.createElement('div');e.className='cell'+(d===19?' today':'');e.innerHTML='<span class="num">'+d+'</span>';(events[d]||[]).forEach(v=>{const x=document.createElement('div');x.className='event';x.innerHTML='<strong>'+v[1]+'</strong><small>'+v[0]+'</small>';x.onclick=()=>toast(v[1]+' selecionado');e.appendChild(x)});grid.appendChild(e)}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}document.getElementById('newBtn').onclick=()=>toast('Nova tarefa: prévia pronta para interação');document.getElementById('quickBtn').onclick=()=>toast('Captura rápida aberta');document.getElementById('search').addEventListener('input',e=>{toast(e.target.value?'Busca ativa':'Busca limpa')});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');toast('Visualização: '+b.textContent)});
</script></body></html>
