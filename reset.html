<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atualizando Minha Agenda Pro</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#121820;color:#f1f5f9;font:16px system-ui,sans-serif}
main{text-align:center;padding:32px;max-width:520px}
strong{display:block;font-size:1.2rem;margin-bottom:10px}
span{color:#94a3b8}
</style>
</head>
<body>
<main>
<strong>🔄 Limpando a versão antiga...</strong>
<span>Isso remove o cache antigo do aplicativo e abre a versão corrigida.</span>
</main>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){console.warn('Limpeza:',e);}
  setTimeout(()=>{
    const url='./index.html?clean=5&ts='+Date.now();
    const w=window.open(url,'_blank','noopener');
    if(!w) location.href=url;
  },300);
})();
</script>
</body>
</html>
