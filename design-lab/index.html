<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minha Agenda • Design Lab</title>
<style>
:root{--bg:#f4f7f9;--panel:#fff;--panel2:#f8fafb;--text:#10202b;--muted:#687985;--line:#dbe4e8;--accent:#10b9ad;--accent2:#0b8f87;--danger:#ef5b63;--warning:#e7a51b;--success:#13a878;--shadow:0 12px 30px rgba(20,45,60,.07)}
:root.dark{--bg:#0b1219;--panel:#121c26;--panel2:#17222d;--text:#f2f7f9;--muted:#8ea1ad;--line:#273744;--accent:#2dd4bf;--accent2:#14b8a6;--shadow:0 14px 34px rgba(0,0,0,.25)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--panel);padding:18px 12px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;font-weight:800}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#06251f;font-weight:900}.nav{display:grid;gap:5px}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:10px 11px;border-radius:10px;text-align:left;cursor:pointer}.nav button:hover{background:var(--panel2);color:var(--text)}.nav button.active{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--accent);font-weight:750}.folders{margin-top:20px;border-top:1px solid var(--line);padding-top:15px}.folders h4{font-size:10px;letter-spacing:.12em;color:var(--muted);margin:0 8px 8px}.folder{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:var(--muted);padding:8px;border-radius:9px;cursor:pointer;text-align:left}.folder:hover,.folder.active{background:var(--panel2);color:var(--text)}.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:0 0 auto}.badge{margin-left:auto;font-size:10px;border:1px solid var(--line);padding:2px 6px;border-radius:999px}.side-bottom{margin-top:auto;display:grid;gap:7px}.side-bottom button{border:1px dashed var(--line);background:transparent;color:var(--muted);padding:10px;border-radius:9px;cursor:pointer}.main{min-width:0;padding:22px clamp(18px,3vw,38px);max-width:1500px;width:100%;margin:auto}.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}.search{flex:1;min-width:120px;height:42px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);padding:0 14px}.top-actions{display:flex;gap:8px}.btn{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);padding:0 13px;cursor:pointer}.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#042a25;font-weight:800}.shortcuts{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:17px}.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:7px 11px;font-size:12px;cursor:pointer}.chip:hover,.chip.active{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}.hero{border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line));border-radius:18px;padding:23px 24px;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 9%,var(--panel)),var(--panel) 68%);box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{font-size:10px;letter-spacing:.14em;color:var(--accent);font-weight:850}.hero h1{margin:5px 0 4px;font-size:28px;letter-spacing:-.03em}.muted{color:var(--muted);font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:15px 0}.metric{border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:14px 16px}.metric strong{font-size:24px;display:block}.metric span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0}.tabs{display:flex;gap:4px;flex-wrap:wrap}.tab{border:1px solid transparent;background:transparent;color:var(--muted);padding:9px 11px;border-radius:9px;cursor:pointer}.tab.active{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent);font-weight:750}.content{min-height:360px}.view-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:15px}.card{border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:17px;box-shadow:var(--shadow)}.card h2{font-size:15px;margin:0 0 13px}.task{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.task:first-of-type{border-top:0}.check{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}.task-main{min-width:0;flex:1}.task-title{font-weight:750;font-size:13px}.task.done .task-title{text-decoration:line-through;opacity:.55}.meta{font-size:11px;color:var(--muted);margin-top:3px}.priority{font-size:10px;padding:4px 7px;border-radius:999px;border:1px solid var(--line)}.priority.alta{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}.priority.media{color:var(--warning)}.priority.baixa{color:#4e91dc}.week-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.week-nav{display:flex;gap:6px}.week{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:15px;overflow:hidden;background:var(--panel)}.day{min-height:310px;border-right:1px solid var(--line);padding:10px}.day:last-child{border-right:0}.day.today{background:color-mix(in srgb,var(--accent) 6%,var(--panel));box-shadow:inset 0 2px 0 var(--accent)}.day-name{font-size:10px;color:var(--muted);text-transform:uppercase}.day-num{font-size:20px;font-weight:800;margin:2px 0 9px}.event{border-left:3px solid var(--accent);background:var(--panel2);border-radius:0 9px 9px 0;padding:9px;margin:7px 0;cursor:pointer}.event:hover{transform:translateY(-1px);border-color:var(--accent)}.event b{font-size:11px;display:block}.event span{font-size:10px;color:var(--muted)}.month{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:15px;overflow:hidden;background:var(--panel)}.month .cell{min-height:110px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px}.cell.today{box-shadow:inset 0 3px 0 var(--accent);background:color-mix(in srgb,var(--accent) 5%,var(--panel))}.cell strong{font-size:12px}.dots{display:flex;gap:4px;margin-top:10px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--accent)}.list-row{display:grid;grid-template-columns:30px 1fr 100px 110px;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line)}.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.column{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:11px;min-height:300px}.column h3{font-size:12px;margin:0 0 9px}.kanban .task{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:7px}.empty{border:1px dashed var(--line);border-radius:14px;padding:35px;text-align:center;color:var(--muted)}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-backdrop.show{display:flex}.modal{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 25px 70px rgba(0,0,0,.3)}.modal h2{margin:0 0 16px;font-size:19px}.form{display:grid;gap:10px}.form label{font-size:11px;color:var(--muted)}.form input,.form select{width:100%;height:42px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:0 11px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}.labbar{position:fixed;right:15px;bottom:15px;background:#15222c;color:#fff;padding:8px 11px;border-radius:10px;font-size:10px;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media(max-width:1050px){.app{grid-template-columns:210px}.view-grid{grid-template-columns:1fr}.week{overflow:auto}.day{min-width:145px}.month{min-width:700px}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-260px;z-index:40;width:248px;transition:left .2s}.sidebar.open{left:0}.main{padding:14px}.topbar{flex-wrap:wrap}.top-actions{width:100%}.top-actions .btn{flex:1}.hero{align-items:flex-start;flex-direction:column}.metrics{grid-template-columns:1fr 1fr}.toolbar{align-items:flex-start;flex-direction:column}.kanban{grid-template-columns:1fr}.list-row{grid-template-columns:30px 1fr 80px}.list-row .meta.hide-sm{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="avatar">MA</div><div>Minha Agenda<div class="muted">Design Lab</div></div></div><nav class="nav" id="nav"><button data-view="dashboard" class="active">⌂ Centro de comando</button><button data-view="list">☷ Agenda geral</button><button data-view="week">□ Semana</button><button data-view="month">▦ Mês</button><button data-view="kanban">▱ Kanban</button></nav><div class="folders"><h4>PASTAS</h4><button class="folder active" data-folder="Todas"><i class="dot"></i>Todas<span class="badge" id="allCount">0</span></button><button class="folder" data-folder="Trabalho"><i class="dot" style="background:#3b82f6"></i>Trabalho<span class="badge">3</span></button><button class="folder" data-folder="Igreja"><i class="dot" style="background:#8b5cf6"></i>Igreja<span class="badge">2</span></button><button class="folder" data-folder="Pessoal"><i class="dot" style="background:#f59e0b"></i>Pessoal<span class="badge">2</span></button></div><div class="side-bottom"><button id="newSide">+ Nova tarefa</button><button id="themeBtn">◐ Alternar tema</button></div></aside>
<main class="main"><div class="topbar"><button class="btn" id="menuBtn" aria-label="Abrir menu">☰</button><input class="search" id="search" placeholder="Buscar tarefa..."/><div class="top-actions"><button class="btn" id="clearSearch">Limpar</button><button class="btn primary" id="newBtn">+ Novo item</button></div></div><div class="shortcuts"><button class="chip" data-filter="today">Hoje</button><button class="chip" data-filter="overdue">Atrasadas</button><button class="chip" data-filter="high">Alta prioridade</button><button class="chip" data-filter="nodate">Sem data</button><button class="chip" id="clearFilters">Limpar filtros</button></div><section class="hero"><div><div class="eyebrow">DESIGN LAB • AMBIENTE DE TESTE</div><h1 id="pageTitle">Bom dia, Felipe</h1><div class="muted">Clique, crie, conclua, filtre e troque de visualização. Nada aqui altera a produção.</div></div><button class="btn primary" id="heroNew">+ Nova tarefa</button></section><section class="metrics"><div class="metric"><strong id="mOverdue">0</strong><span>Atrasadas</span></div><div class="metric"><strong id="mToday">0</strong><span>Hoje</span></div><div class="metric"><strong id="mPending">0</strong><span>Pendentes</span></div><div class="metric"><strong id="mDone">0%</strong><span>Progresso</span></div></section><div class="toolbar"><div class="tabs"><button class="tab active" data-view="dashboard">Dashboard</button><button class="tab" data-view="list">Lista</button><button class="tab" data-view="week">Semana</button><button class="tab" data-view="month">Mês</button><button class="tab" data-view="kanban">Kanban</button></div><span class="muted" id="resultCount">0 resultados</span></div><section class="content" id="content"></section></main></div><div class="labbar">LABORATÓRIO • NÃO É PRODUÇÃO</div>
<div class="modal-backdrop" id="modal"><form class="modal" id="taskForm"><h2>Nova tarefa</h2><div class="form"><div><label>Título</label><input id="fTitle" required placeholder="Ex.: Preparar reunião"></div><div><label>Data</label><input id="fDate" type="date"></div><div><label>Horário</label><input id="fTime" type="time"></div><div><label>Pasta</label><select id="fFolder"><option>Trabalho</option><option>Igreja</option><option>Pessoal</option></select></div><div><label>Prioridade</label><select id="fPriority"><option>Alta</option><option selected>Média</option><option>Baixa</option></select></div><div class="form-actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Criar tarefa</button></div></div></form></div>
<script>
const seed=[
{id:1,title:'Envio com Urgência do PTU Obrigatório',date:'2026-10-15',time:'17:00',folder:'Trabalho',priority:'Alta',done:false},
{id:2,title:'Culto de Quinta',date:'2026-10-15',time:'20:00',folder:'Igreja',priority:'Média',done:false},
{id:3,title:'Revisar Agenda da Semana',date:'2026-10-16',time:'09:00',folder:'Pessoal',priority:'Baixa',done:false},
{id:4,title:'Reunião de parametrização',date:'2026-10-16',time:'14:00',folder:'Trabalho',priority:'Alta',done:true},
{id:5,title:'Jornada de Conhecimento',date:'2026-10-17',time:'10:00',folder:'Igreja',priority:'Média',done:false},
{id:6,title:'Organizar documentos',date:'2026-10-18',time:'11:00',folder:'Pessoal',priority:'Baixa',done:false},
{id:7,title:'Tarefa sem data',date:'',time:'',folder:'Trabalho',priority:'Média',done:false}
];
let tasks=JSON.parse(localStorage.getItem('agenda-design-lab-tasks')||'null')||seed;let view='dashboard',folder='Todas',filter='',query='';
const today='2026-10-15';
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
function save(){localStorage.setItem('agenda-design-lab-tasks',JSON.stringify(tasks))}
function visible(){return tasks.filter(t=>(folder==='Todas'||t.folder===folder)&&(!query||t.title.toLowerCase().includes(query.toLowerCase()))&&(!filter||filterMatch(t)))}
function filterMatch(t){if(filter==='today')return t.date===today;if(filter==='overdue')return t.date&&t.date<today&&!t.done;if(filter==='high')return t.priority==='Alta';if(filter==='nodate')return !t.date;return true}
function fmtDate(d){if(!d)return 'Sem data';const [y,m,day]=d.split('-');return `${day}/${m}/${y}`}
function taskHtml(t){return `<div class="task ${t.done?'done':''}"><input class="check" type="checkbox" data-id="${t.id}" ${t.done?'checked':''}><div class="task-main"><div class="task-title">${escapeHtml(t.title)}</div><div class="meta">${fmtDate(t.date)}${t.time?' • '+t.time:''} • ${t.folder}</div></div><span class="priority ${t.priority.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}">${t.priority}</span></div>`}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function render(){const v=visible();$('#allCount').textContent=tasks.filter(t=>!t.done).length;$('#mOverdue').textContent=tasks.filter(t=>t.date&&t.date<today&&!t.done).length;$('#mToday').textContent=tasks.filter(t=>t.date===today&&!t.done).length;$('#mPending').textContent=tasks.filter(t=>!t.done).length;const done=tasks.length?Math.round(tasks.filter(t=>t.done).length/tasks.length*100):0;$('#mDone').textContent=done+'%';$('#resultCount').textContent=v.length+' resultado'+(v.length===1?'':'s');$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let html='';if(view==='dashboard')html=dashboard(v);if(view==='list')html=list(v);if(view==='week')html=week(v);if(view==='month')html=month(v);if(view==='kanban')html=kanban(v);$('#content').innerHTML=html;bindChecks()}
function dashboard(v){return `<div class="view-grid"><div class="card"><h2>Prioridade</h2>${v.length?v.slice(0,5).map(taskHtml).join(''):'<div class="empty">Nenhuma tarefa encontrada.</div>'}</div><div class="card"><h2>Agenda de hoje</h2>${v.filter(t=>t.date===today).length?v.filter(t=>t.date===today).map(taskHtml).join(''):'<div class="empty">Nada programado para hoje.</div>'}</div></div>`}
function list(v){return `<div class="card">${v.length?v.map(t=>`<div class="list-row"><input class="check" type="checkbox" data-id="${t.id}" ${t.done?'checked':''}><div><b class="task-title">${escapeHtml(t.title)}</b><div class="meta">${t.folder}</div></div><span class="priority ${t.priority.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}">${t.priority}</span><span class="meta">${fmtDate(t.date)} ${t.time||''}</span></div>`).join(''):'<div class="empty">Nenhuma tarefa encontrada.</div>'}</div>`}
function week(v){const days=[15,16,17,18,19,20,21];const names=['QUI','SEX','SÁB','DOM','SEG','TER','QUA'];return `<div class="card"><div class="week-head"><div><b>Outubro de 2026 • 15/10 – 21/10</b><div class="muted">Semana de teste interativa</div></div><div class="week-nav"><button class="btn" onclick="alert('Navegação visual do laboratório')">‹</button><button class="btn" onclick="setView('dashboard')">Hoje</button><button class="btn">›</button></div></div><div class="week">${days.map((d,i)=>{const date=`2026-10-${String(d).padStart(2,'0')}`;const ds=v.filter(t=>t.date===date);return `<div class="day ${date===today?'today':''}"><div class="day-name">${names[i]}</div><div class="day-num">${d}</div>${ds.map(t=>`<div class="event" onclick="toggleTask(${t.id})"><b>${escapeHtml(t.time||'Sem horário')} · ${escapeHtml(t.title)}</b><span>${t.folder} • ${t.priority}</span></div>`).join('')}</div>`}).join('')}</div></div>`}
function month(v){const days=31;return `<div class="card"><div class="week-head"><b>Outubro de 2026</b><span class="muted">Clique nos pontos para testar conclusão</span></div><div class="month">${Array.from({length:31},(_,i)=>{const d=i+1,date=`2026-10-${String(d).padStart(2,'0')}`,ds=v.filter(t=>t.date===date);return `<div class="cell ${date===today?'today':''}" onclick="${ds[0]?`toggleTask(${ds[0].id})`:''}"><strong>${d}</strong>${ds.length?`<div class="dots">${ds.slice(0,4).map(()=>'<i></i>').join('')}</div>`:''}</div>`}).join('')}</div></div>`}
function kanban(v){const cols=['Pendentes','Em andamento','Concluídas'];return `<div class="kanban">${cols.map((c,i)=>{const list=i===0?v.filter(t=>!t.done):i===2?v.filter(t=>t.done):[];return `<div class="column"><h3>${c} <span class="badge">${list.length}</span></h3>${list.length?list.map(taskHtml).join(''):'<div class="empty">Vazio</div>'}</div>`}).join('')}</div>`}
function bindChecks(){$$('.check').forEach(c=>c.addEventListener('change',()=>toggleTask(Number(c.dataset.id))))}
function toggleTask(id){const t=tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();render()}}
function setView(v){view=v;render();window.scrollTo({top:0,behavior:'smooth'})}
$$('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
$$('.folder').forEach(b=>b.addEventListener('click',()=>{folder=b.dataset.folder;$$('.folder').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}));
$$('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=filter===b.dataset.filter?'':b.dataset.filter;$$('[data-filter]').forEach(x=>x.classList.toggle('active',x===b&&filter));render()}));
$('#clearFilters').onclick=()=>{filter='';query='';$('#search').value='';render()};$('#clearSearch').onclick=()=>{$('#search').value='';query='';render()};$('#search').oninput=e=>{query=e.target.value;render()};
function openModal(){ $('#modal').classList.add('show');$('#fTitle').focus() }function closeModal(){$('#modal').classList.remove('show');$('#taskForm').reset()}
$('#newBtn').onclick=openModal;$('#newSide').onclick=openModal;$('#heroNew').onclick=openModal;$('#cancel').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
$('#taskForm').onsubmit=e=>{e.preventDefault();tasks.push({id:Date.now(),title:$('#fTitle').value.trim(),date:$('#fDate').value,time:$('#fTime').value,folder:$('#fFolder').value,priority:$('#fPriority').value,done:false});save();closeModal();render()};
$('#themeBtn').onclick=()=>{document.documentElement.classList.toggle('dark');localStorage.setItem('agenda-design-lab-theme',document.documentElement.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('agenda-design-lab-theme')==='dark')document.documentElement.classList.add('dark');$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
render();
</script></body></html>
