<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minha Agenda Pro • V13 Dashboard</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111c;color:#eef5ff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{position:fixed;inset:0}
iframe{width:100%;height:100%;border:0;background:#08111c}
#preview-badge{position:fixed;right:18px;top:14px;z-index:99999;padding:7px 11px;border:1px solid rgba(63,140,255,.5);border-radius:999px;background:rgba(8,16,27,.9);backdrop-filter:blur(12px);color:#9fc6ff;font-size:11px;font-weight:800;letter-spacing:.25px;box-shadow:0 12px 35px rgba(0,0,0,.25);pointer-events:none}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;z-index:100000;padding:10px 14px;border:1px solid #334b66;border-radius:12px;background:#142233;color:#eaf3ff;font-size:13px;transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app"><iframe id="site" src="./index.html" title="Prévia V13"></iframe></div>
<div id="preview-badge">PRÉVIA V13 · MODERN DASHBOARD</div>
<div id="toast"></div>
<script>
const iframe=document.getElementById('site');
const toastEl=document.getElementById('toast');
let toastTimer;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1800)}
function inject(){
 const d=iframe.contentDocument;
 if(!d||!d.body)return;
 if(d.getElementById('v13-style'))return;
 const style=d.createElement('style');style.id='v13-style';style.textContent=`
 :root{--v13-bg:#08111c;--v13-surface:#0e1a27;--v13-surface2:#111f2d;--v13-border:#223448;--v13-blue:#3f8cff;--v13-cyan:#22d3c5;--v13-text:#f1f6ff;--v13-muted:#8da2b9;--v13-danger:#ff6678;--v13-warning:#f6b93b;--v13-green:#28d7a2}
 html,body{background:radial-gradient(circle at 82% 0%,rgba(36,104,190,.08),transparent 35%),var(--v13-bg)!important;color:var(--v13-text)!important}
 body{letter-spacing:.005em}
 #sidebar{width:280px!important;background:linear-gradient(180deg,#0b1622 0%,#08131e 100%)!important;border-right:1px solid #1e3042!important;box-shadow:22px 0 60px rgba(0,0,0,.2);z-index:100}
 #main{margin-left:280px!important;padding:20px 28px 34px!important;background:transparent!important;max-width:none!important}
 .user-profile{position:relative;padding:18px 18px 16px!important;border-bottom:1px solid #1d3042!important;min-height:64px}
 .user-profile:before{content:'MINHA AGENDA';display:block;position:absolute;left:18px;top:12px;color:#6f91b5;font-size:9px;font-weight:850;letter-spacing:1.5px;transform:translateY(-1px)}
 .user-profile .user-info{padding-top:10px}
 .user-name{font-size:15px!important;font-weight:800!important;color:#f4f8ff!important}
 .btn-logout{font-size:11px!important;color:#70859c!important}
 .user-avatar{width:40px!important;height:40px!important;background:linear-gradient(135deg,#1d6cff,#53b8ff)!important;box-shadow:0 0 0 3px rgba(63,140,255,.12),0 8px 25px rgba(0,88,255,.22)!important}
 .nav-group{padding:12px 10px 18px!important}
 .nav-section-title{margin:18px 8px 8px!important;color:#667f9b!important;font-size:9px!important;letter-spacing:1.5px!important;font-weight:850!important}
 .nav-item{min-height:42px!important;margin-bottom:4px!important;padding:9px 11px!important;border:1px solid transparent!important;border-radius:11px!important;color:#91a7bd!important;font-size:13px!important;font-weight:600!important;transition:.16s ease!important}
 .nav-item:hover{background:rgba(63,140,255,.07)!important;border-color:#1d334a!important;color:#edf5ff!important;transform:translateX(1px)}
 .nav-item.active{background:linear-gradient(90deg,rgba(63,140,255,.20),rgba(63,140,255,.055))!important;border-color:rgba(63,140,255,.48)!important;color:#68a8ff!important;box-shadow:inset 3px 0 #3f8cff,0 8px 25px rgba(0,0,0,.12)!important}
 .folder-badge{background:#18283a!important;border:1px solid #2b4055!important;color:#a9bdd1!important}
 .folder-menu-btn{color:#7188a1!important}
 .dropdown{background:#101c29!important;border-color:#2b4055!important;box-shadow:0 20px 60px rgba(0,0,0,.5)!important}
 .dropdown-item:hover{background:#1a2a3c!important}
 #main:before{content:'';display:block;position:fixed;inset:0 0 0 280px;pointer-events:none;background:radial-gradient(circle at 75% 12%,rgba(63,140,255,.065),transparent 28%),radial-gradient(circle at 32% 100%,rgba(34,211,197,.035),transparent 26%)}
 .top-bar{position:relative;z-index:2;gap:10px!important;margin-bottom:10px!important;align-items:center!important}
 .search-input{height:44px!important;min-height:44px!important;background:#0d1926!important;border:1px solid #21364b!important;border-radius:12px!important;padding:0 15px!important;font-size:13px!important;box-shadow:inset 0 1px rgba(255,255,255,.025),0 8px 28px rgba(0,0,0,.12)!important}
 .search-input:focus{border-color:#3f8cff!important;box-shadow:0 0 0 3px rgba(63,140,255,.10)!important}
 button,.btn{border-radius:11px!important}
 .top-bar button{min-height:44px!important}
 .quick-capture{position:relative;z-index:2;margin-bottom:18px!important;gap:10px!important}
 .quick-capture input{height:48px!important;background:#0e1a27!important;border:1px solid #203448!important;border-radius:12px!important;padding:0 16px!important;color:#dceaff!important}
 .quick-capture input:focus{border-color:#3f8cff!important;box-shadow:0 0 0 3px rgba(63,140,255,.08)!important}
 .quick-capture button{min-width:116px!important;border-radius:11px!important}
 .quick-preview{background:#101d2b!important;border-color:#31567e!important;border-radius:14px!important}
 .myday-v2{position:relative;z-index:2;gap:14px!important;margin-bottom:20px!important}
 .myday-hero-v2{min-height:112px!important;padding:22px 24px!important;border:1px solid #2d4d6c!important;border-left:3px solid #3f8cff!important;border-radius:18px!important;background:linear-gradient(120deg,rgba(20,39,58,.95),rgba(13,29,45,.96) 56%,rgba(13,25,40,.94))!important;box-shadow:0 16px 45px rgba(0,0,0,.18),inset 0 1px rgba(255,255,255,.025)!important;overflow:hidden}
 .myday-hero-v2:after{content:'';position:absolute;right:-100px;top:-110px;width:360px;height:300px;border-radius:50%;border:1px solid rgba(63,140,255,.10);box-shadow:0 0 0 48px rgba(63,140,255,.025),0 0 0 96px rgba(63,140,255,.018);pointer-events:none}
 .myday-eyebrow,.myday-section-kicker{color:#4aa0ff!important;font-size:10px!important;letter-spacing:1.25px!important}
 .myday-title{font-size:29px!important;line-height:1.1!important;letter-spacing:-.045em!important;font-weight:850!important}
 .myday-subtitle{font-size:12px!important;color:#91a9c2!important}
 .myday-header-actions{position:relative;z-index:2}
 .myday-primary-action{min-height:44px!important;padding:0 17px!important;border-radius:11px!important;background:linear-gradient(135deg,#36d6c2,#21bfc2)!important;color:#06151c!important;box-shadow:0 10px 30px rgba(34,211,197,.16)!important}
 .myday-stats{grid-template-columns:repeat(3,minmax(150px,1fr)) 1.75fr!important;gap:10px!important}
 .myday-stat,.myday-progress{min-height:102px!important;border:1px solid #263b50!important;border-radius:15px!important;background:linear-gradient(145deg,#111d29,#0e1925)!important;box-shadow:0 10px 30px rgba(0,0,0,.10)!important}
 .myday-stat{padding:16px!important}
 .myday-stat:hover,.myday-stat.active{border-color:#3f8cff!important;background:linear-gradient(145deg,#122238,#0f1c2a)!important;transform:translateY(-1px)}
 .myday-stat strong{font-size:28px!important;font-weight:850!important;letter-spacing:-.04em}
 .myday-stat small{font-size:10px!important;letter-spacing:.5px!important;text-transform:uppercase!important;color:#88a0b8!important}
 .myday-stat-icon{width:38px!important;height:38px!important;border-radius:11px!important;background:#1a2a3a!important}
 .myday-stat-icon.danger{color:#ff7180!important;background:rgba(255,79,98,.12)!important}
 .myday-stat-icon.warning{color:#f7c14d!important;background:rgba(246,185,59,.12)!important}
 .myday-stat-icon.success{color:#2bd8a2!important;background:rgba(43,216,162,.10)!important}
 .myday-stat-icon.accent{color:#55a4ff!important;background:rgba(63,140,255,.10)!important}
 .myday-progress{padding:16px!important;min-width:0!important}
 .myday-progress-head{font-size:10px!important;text-transform:uppercase!important;letter-spacing:.7px!important;color:#8aa1b8!important}
 .myday-progress-head strong{font-size:18px!important;color:#f2f6fc!important}
 .myday-progress-track{height:8px!important;background:#202f3e!important}
 .myday-progress-track span{background:linear-gradient(90deg,#3f8cff,#22d3c5)!important;box-shadow:0 0 15px rgba(63,140,255,.35)}
 .myday-progress small{font-size:10px!important;color:#7e95ad!important}
 .myday-filter-bar{font-size:10px!important}
 .myday-grid{position:relative;z-index:2;grid-template-columns:minmax(0,1.04fr) minmax(0,.96fr)!important;gap:14px!important}
 .myday-grid>div{gap:14px!important}
 .myday-section,.myday-next-card{border:1px solid #253a4e!important;border-radius:16px!important;background:linear-gradient(145deg,#111d29,#0d1824)!important;padding:16px!important;box-shadow:0 12px 34px rgba(0,0,0,.11)!important}
 .myday-section-head{margin-bottom:12px!important}
 .myday-section-title{font-size:16px!important;font-weight:800!important}
 .myday-focus-list{gap:7px!important}
 .myday-focus-item{min-height:48px!important;padding:10px 12px!important;border:1px solid #1e3042!important;border-radius:11px!important;background:#0e1a26!important}
 .myday-focus-item:hover{border-color:#315274!important;background:#122131!important;transform:translateX(1px)}
 .myday-focus-index{width:28px!important;height:28px!important;border-radius:9px!important;background:rgba(63,140,255,.11)!important;color:#5ba7ff!important;border:1px solid rgba(63,140,255,.22)}
 .myday-focus-copy strong{font-size:12px!important}.myday-focus-copy small{font-size:10px!important;color:#7f96ad!important}
 .myday-arrow{font-size:16px!important;color:#587089!important}
 .myday-next-card{min-height:72px!important;background:linear-gradient(135deg,rgba(63,140,255,.08),rgba(34,211,197,.025))!important}
 .myday-next-title{font-size:13px!important}.myday-next-meta{font-size:10px!important}
 /* Visual hierarchy for the dashboard blocks that already exist in the app. */
 .myday-grid .myday-section:first-child{border-left:3px solid #22d3c5!important}
 .myday-grid .myday-section:last-child{border-left:3px solid #3f8cff!important}
 /* Preserve the real app, only soften dense legacy surfaces. */
 .card,.panel,.task-card,.list-card{border-color:#24384b!important;background:#101c28!important}
 @media(max-width:1000px){#main{padding:18px!important}.myday-stats{grid-template-columns:repeat(2,minmax(0,1fr))!important}.myday-grid{grid-template-columns:1fr!important}}
 @media(max-width:768px){#sidebar{width:286px!important}#main{margin-left:0!important;padding:14px!important}.myday-hero-v2{padding:18px!important;min-height:96px!important}.myday-title{font-size:24px!important}.myday-stats{grid-template-columns:1fr 1fr!important}.myday-progress{grid-column:1/-1}.top-bar{gap:8px!important}.quick-capture{gap:7px!important}}
 `;d.head.appendChild(style);
 addBrand(d);
 addFolderPolish(d);
}
function addBrand(d){
 if(d.getElementById('v13-brand'))return;
 const profile=d.querySelector('#sidebar .user-profile');
 if(!profile)return;
 const brand=d.createElement('div');brand.id='v13-brand';brand.innerHTML='<span class="v13-logo">MA</span><span><b>Minha Agenda</b><small>Pro</small></span>';
 brand.style.cssText='display:flex;align-items:center;gap:9px;margin:0 2px 14px;padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.04);color:#eef5ff;font-size:13px;font-weight:800';
 const logo=brand.querySelector('.v13-logo');logo.style.cssText='width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#2478ff,#22d3c5);color:#06111b;font-size:11px;font-weight:900;box-shadow:0 8px 22px rgba(63,140,255,.2)';
 const small=brand.querySelector('small');small.style.cssText='color:#4aa0ff;font-size:11px;margin-left:3px';
 profile.parentNode.insertBefore(brand,profile);
}
function addFolderPolish(d){
 const panel=d.getElementById('v12-folder-panel');
 if(!panel)return;
 panel.style.borderTop='1px solid rgba(255,255,255,.045)';
 const title=d.getElementById('v12-folder-title');if(title)title.textContent='SUAS PASTAS';
 const hint=d.getElementById('v12-hint');if(hint)hint.textContent='Organize por projetos, áreas ou qualquer estrutura que faça sentido para você.';
}
iframe.addEventListener('load',()=>{setTimeout(inject,80);setTimeout(inject,600)});
</script>
</body>
</html>
