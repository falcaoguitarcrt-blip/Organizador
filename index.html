<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Agenda Pro</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2dd4bf">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2360/2360875.png">

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <style>
    :root { 
      --bg: #121820; 
      --card: #1a232e; 
      --border: #2a3646; 
      --accent: #2dd4bf; 
      --accent-hover: #14b8a6; 
      --text: #f1f5f9; 
      --muted: #94a3b8; 
      --danger: #ef4444; 
      --warning: #f59e0b; 
      --purple: #8b5cf6;
      --sidebar-w: 260px; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; }

    /* Auth Overlay */
    #auth-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; }
    .auth-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; text-align: center; max-width: 360px; width: 90%; }
    .btn-google { background: #fff; color: #000; border: 1px solid #dadce0; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 16px; }

    /* Layout Principal */
    #sidebar { width: var(--sidebar-w); background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 100; position: fixed; top: 0; bottom: 0; left: 0; }
    #main { flex: 1; margin-left: var(--sidebar-w); padding: 24px; max-width: 1000px; width: 100%; position: relative; }

    @media (max-width: 768px) {
      #sidebar { transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }
      #main { margin-left: 0; padding: 16px; }
      .mobile-nav-toggle { display: block !important; }
    }
    .mobile-nav-toggle { display: none; background: var(--accent); color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* Perfil */
    .user-profile { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--border); object-fit: cover; }
    .user-info { flex: 1; overflow: hidden; }
    .user-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-logout { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 0.8rem; padding: 0; margin-top: 2px;}

    /* Navegação / Sidebar */
    .nav-group { padding: 12px 8px; flex: 1; overflow-y: auto; }
    .nav-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); margin-bottom: 4px; font-size: 0.95rem; position: relative; user-select: none; }
    .nav-item.sub { padding-left: 28px; font-size: 0.9rem; }
    .nav-item:hover { background: rgba(255,255,255,0.03); color: var(--text); }
    .nav-item.active { background: rgba(45, 212, 191, 0.15); color: var(--accent); font-weight: 600; }
    
    .folder-menu-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 2px 6px; border-radius: 4px; font-size: 1rem; }
    .folder-menu-btn:hover { color: var(--text); background: rgba(255,255,255,0.1); }
    
    /* Dropdown Geral */
    .dropdown { display: none; position: absolute; right: 10px; top: 32px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; z-index: 300; flex-direction: column; box-shadow: 0 8px 20px rgba(0,0,0,0.6); min-width: 140px; }
    .dropdown.show { display: flex; }
    .dropdown-item { padding: 8px 14px; color: var(--text); font-size: 0.85rem; cursor: pointer; text-align: left; background: transparent; border: none; display: flex; align-items: center; gap: 8px; }
    .dropdown-item:hover { background: rgba(255,255,255,0.08); }
    .dropdown-item.danger { color: var(--danger); }

    /* Topbar & Captura Rápida */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap;}
    .search-input { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 8px; flex: 1; min-width: 200px; font-size: 0.9rem; }
    .search-input:focus { border-color: var(--accent); outline: none; }
    
    .quick-capture { display: flex; gap: 8px; width: 100%; margin-bottom: 24px; }
    .quick-capture input { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--text); padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; }
    .quick-capture input:focus { border-color: var(--accent); outline: none; }

    /* Cabeçalho do Conteúdo */
    .folder-header-area { margin-bottom: 24px; }
    .folder-title { font-size: 1.6rem; font-weight: bold; margin-bottom: 6px; display: flex; align-items: center; gap: 12px; }
    .folder-stats { font-size: 0.85rem; color: var(--accent); margin-bottom: 16px; }
    .folder-actions { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .subfolder-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .chip { padding: 6px 12px; background: transparent; border: 1px solid var(--border); border-radius: 20px; font-size: 0.85rem; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .chip:hover { border-color: var(--muted); }
    .chip.active { border-color: var(--accent); background: rgba(45, 212, 191, 0.1); color: var(--accent); font-weight: 600; }
    .color-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

    /* Botoes e Segmentados de Visualização */
    .view-selector { display: flex; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
    .view-btn { padding: 6px 12px; border: none; background: transparent; color: var(--muted); font-size: 0.8rem; font-weight: 600; cursor: pointer; border-radius: 6px; display: flex; align-items: center; gap: 6px; }
    .view-btn.active { background: var(--card); color: var(--accent); border: 1px solid var(--border); }
    .view-btn:hover:not(.active) { color: var(--text); }

    .btn { background: var(--accent); color: #000; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: var(--accent-hover); }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .btn-sm:hover { background: rgba(255,255,255,0.05); }

    /* Períodos e Grupos */
    .period-group { margin-bottom: 28px; }
    .period-header { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: 0.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; user-select: none; }
    .period-header.collapsible { cursor: pointer; }
    .period-header.collapsible:hover { color: var(--text); }
    .period-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* Cards e Itens (Lista) */
    .card { 
      background: var(--card); 
      border: 1px solid var(--border); 
      border-left: 4px solid var(--muted); 
      border-radius: 12px; 
      padding: 14px 16px; 
      margin-bottom: 10px; 
      display: flex; 
      gap: 12px; 
      cursor: pointer; 
      position: relative; 
      transition: border-color 0.2s, opacity 0.2s; 
      -webkit-touch-callout: none; 
      -webkit-user-select: none; 
      user-select: none; 
    }
    .card:hover { border-color: #3b4b5e; }
    .card.status-done { opacity: 0.55; }
    
    .card-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); cursor: pointer; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .card-check:hover { border-color: var(--accent); }
    .card-check.done { background: var(--accent); border-color: var(--accent); }
    .card-check.done::after { content: '✓'; color: #000; font-size: 13px; font-weight: bold; }
    
    .card-body { flex: 1; overflow: hidden; }
    .card-title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-title { font-weight: 600; margin-bottom: 6px; font-size: 0.98rem; color: #fff; word-break: break-word; }
    .card-meta { font-size: 0.75rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
    
    .card-desc { 
      font-size: 0.85rem; 
      color: var(--muted); 
      margin-top: 8px; 
      white-space: pre-wrap; 
      word-break: break-word; 
      line-height: 1.4; 
      -webkit-user-select: text; 
      user-select: text; 
    }
    .card-desc.collapsed { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .btn-toggle-desc { background: none; border: none; color: var(--accent); font-size: 0.75rem; cursor: pointer; padding: 2px 0; margin-top: 2px; font-weight: 600; }

    /* Selos de Status */
    .badge-status { font-size: 0.68rem; padding: 2px 6px; border-radius: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
    .badge-status.doing { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid var(--warning); }
    .badge-status.waiting { background: rgba(139, 92, 246, 0.15); color: #c4b5fd; border: 1px solid var(--purple); }

    .postpone-btn { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid var(--warning); padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: bold; cursor: pointer; margin-left: auto; }
    .postpone-btn:hover { background: rgba(245, 158, 11, 0.3); }

    .item-more-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 2px 6px; font-size: 1.1rem; border-radius: 4px; }
    .item-more-btn:hover { color: var(--text); background: rgba(255,255,255,0.1); }

    /* Visualização: Cards (Quadrantes Grid) */
    .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .grid-cards .card { flex-direction: column; margin-bottom: 0; justify-content: space-between; }
    .grid-cards .card-body { width: 100%; }

    /* Visualização: Kanban */
    .kanban-board { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 16px; align-items: flex-start; }
    .kanban-col { flex: 1; min-width: 250px; max-width: 320px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 12px; padding: 12px; min-height: 400px; display: flex; flex-direction: column; }
    .kanban-header { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .kanban-cards { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 100px; }
    .kanban-cards.drag-over { background: rgba(45, 212, 191, 0.05); border-radius: 8px; }

    /* Visualização: Calendário Semanal */
    .calendar-controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; background: var(--card); padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); }
    .calendar-scroll-container { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; min-width: 700px; }
    .cal-col { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 8px; padding: 8px; min-height: 250px; }
    .cal-header { font-size: 0.78rem; font-weight: 700; text-align: center; margin-bottom: 8px; color: var(--muted); padding-bottom: 4px; border-bottom: 1px solid var(--border); }
    .cal-item { background: var(--card); border-left: 3px solid var(--accent); padding: 6px 8px; border-radius: 6px; font-size: 0.78rem; margin-bottom: 6px; cursor: pointer; word-break: break-word; }
    .cal-item:hover { border-color: var(--accent-hover); background: rgba(255,255,255,0.05); }

    /* Estado Vazio */
    .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
    .empty-state p { margin-bottom: 16px; font-size: 0.95rem; }

    /* Context Menu Flutuante */
    #context-menu { position: fixed; background: var(--card); border: 1px solid var(--border); border-radius: 10px; z-index: 9999; box-shadow: 0 10px 25px rgba(0,0,0,0.7); display: none; flex-direction: column; min-width: 200px; max-height: 85vh; overflow-y: auto; padding: 4px 0; }
    #context-menu .ctx-item { padding: 9px 16px; font-size: 0.85rem; color: var(--text); background: transparent; border: none; text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: space-between; width: 100%; }
    #context-menu .ctx-item:hover { background: rgba(255,255,255,0.08); }
    #context-menu .ctx-item.danger { color: var(--danger); }
    #context-menu .ctx-divider { height: 1px; background: var(--border); margin: 4px 0; }
    #context-menu .ctx-date-picker { padding: 6px 14px; display: flex; align-items: center; gap: 8px; }
    #context-menu .ctx-date-picker input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 6px; font-size: 0.8rem; width: 100%; }

    /* Modais */
    .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(3px); }
    .modal.open { display: flex; }
    .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 90%; max-width: 540px; padding: 24px; max-height: 90vh; overflow-y: auto; }
    
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    .form-control { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 8px; outline: none; font-size: 0.9rem; }
    .form-control:focus { border-color: var(--accent); }
    textarea.form-control { resize: vertical; min-height: 90px; line-height: 1.4; overflow-y: hidden; }

    .checklist-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
    .star-btn { background: transparent; border: none; font-size: 1.2rem; cursor: pointer; }
    .star-btn.active { color: var(--warning); }
    .star-btn.inactive { color: var(--muted); }
  </style>
</head>
<body>

  <!-- Login Overlay -->
  <div id="auth-overlay">
    <div class="auth-card">
      <h2 style="margin-bottom: 8px;">Minha Agenda Pro</h2>
      <p style="color: var(--muted); font-size: 0.9rem;">Sincronizando tarefas offline e nuvem...</p>
      <button class="btn-google" onclick="loginGoogle()">Entrar com o Google</button>
    </div>
  </div>

  <!-- Menu Contextual Flutuante -->
  <div id="context-menu" onclick="event.stopPropagation()"></div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="user-profile">
      <img id="u-avatar" class="user-avatar" src="" alt="Avatar">
      <div class="user-info">
        <div id="u-name" class="user-name">Carregando...</div>
        <button class="btn-logout" onclick="logout()">Sair</button>
      </div>
    </div>
    
    <div class="nav-group">
      <div class="nav-item" id="nav-all" onclick="setArea('all')">
        <span>📋 Agenda geral</span>
      </div>
      <div style="margin: 20px 8px 8px; font-weight: 700; font-size: 0.75rem; color: var(--muted);">PASTAS</div>
      <div id="folder-tree"></div>
      <button class="btn-sm" style="margin: 12px 8px; width: calc(100% - 16px); justify-content: center;" onclick="openFolderModal()">+ Nova Pasta</button>
    </div>
  </div>

  <!-- Conteúdo Principal -->
  <div id="main">
    <div class="top-bar">
      <button class="mobile-nav-toggle" onclick="toggleSidebar()">☰ Menu</button>
      <input type="text" class="search-input" placeholder="Buscar (/)..." oninput="filterItems(this.value)">
      <button class="btn" onclick="openItemModal()">+ Novo item</button>
    </div>

    <div class="quick-capture">
      <input type="text" id="quick-input" placeholder="Captura rápida: Ex: Treino amanhã 18h #Academia" onkeypress="handleQuickCapture(event)">
      <button class="btn" onclick="processQuickCapture()">Salvar</button>
    </div>

    <div id="header-container"></div>
    <div id="items-container"></div>
  </div>

  <!-- Modal de Item -->
  <div id="item-modal" class="modal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="font-size: 1.2rem;" id="modal-item-title-head">Item da Agenda</h3>
        <div>
          <button id="f-delete-btn" class="btn-sm" style="display:inline-flex; border-color:var(--danger); color:var(--danger); margin-right:8px;" onclick="deleteCurrentItem()">🗑️ Excluir</button>
          <button id="f-star-btn" class="star-btn inactive" onclick="toggleFormStar()">☆</button>
        </div>
      </div>
      
      <div class="form-group" id="template-loader-box">
        <label>Carregar Modelo (Opcional)</label>
        <select id="f-load-template" class="form-control" onchange="loadTemplate(this.value)"></select>
      </div>

      <div class="form-group">
        <label>O que é?</label>
        <input type="text" id="f-title" class="form-control" placeholder="Título. Ex: Culto de Quinta">
      </div>
      <div class="form-group">
        <label>Descrição detalhada</label>
        <textarea id="f-desc" class="form-control" placeholder="Anotações e detalhes do compromisso..." oninput="autoResizeTextarea(this)"></textarea>
      </div>

      <div class="form-group" style="display: flex; gap: 12px;">
        <div style="flex:1;">
          <label>Pasta</label>
          <select id="f-area" class="form-control"></select>
        </div>
        <div style="flex:1;">
          <label>Situação</label>
          <select id="f-status" class="form-control">
            <option value="todo">A Fazer</option>
            <option value="doing">Em andamento</option>
            <option value="waiting">Aguardando</option>
            <option value="done">Concluído</option>
          </select>
        </div>
      </div>

      <div class="form-group" style="display: flex; gap: 12px;">
        <div style="flex:1;">
          <label>Data</label>
          <input type="date" id="f-date" class="form-control">
        </div>
        <div style="flex:1;">
          <label>Hora</label>
          <input type="time" id="f-time" class="form-control">
        </div>
      </div>

      <div class="form-group">
        <label>Repetir (Gera cópia ao concluir)</label>
        <select id="f-rep" class="form-control">
          <option value="none">Não repete</option>
          <option value="daily">Diariamente</option>
          <option value="weekly">Semanalmente</option>
          <option value="monthly">Mensalmente</option>
        </select>
      </div>

      <div class="form-group">
        <label>Checklist / Subtarefas (Enter cria novo | Backspace em vazio remove)</label>
        <div id="checklist-container"></div>
        <button type="button" class="btn-sm" style="margin-top: 8px; width: 100%; justify-content: center;" onclick="addChecklistItem('', false, true)">+ Adicionar subitem</button>
      </div>

      <div class="form-group">
        <label>Link Externo</label>
        <input type="url" id="f-link" class="form-control" placeholder="https://...">
      </div>

      <div class="form-group" style="display: flex; align-items: center; gap: 8px; margin-top: 16px;">
        <input type="checkbox" id="f-save-template"> <label for="f-save-template" style="margin:0; cursor:pointer;">Salvar como Modelo Reutilizável</label>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
        <button class="btn" style="background: transparent; color: var(--text);" onclick="attemptCloseItemModal()">Cancelar</button>
        <button class="btn" onclick="saveItem()">Salvar Item</button>
      </div>
    </div>
  </div>

  <!-- Modal de Pasta -->
  <div id="folder-modal" class="modal">
    <div class="modal-content" style="max-width: 400px;">
      <h3 id="folder-modal-title" style="margin-bottom: 20px;">Nova Pasta</h3>
      <input type="hidden" id="f-folder-id">
      
      <div class="form-group">
        <label>Nome</label>
        <input type="text" id="f-folder-name" class="form-control">
      </div>
      
      <div class="form-group">
        <label>Cor de identificação</label>
        <input type="color" id="f-folder-color" class="form-control" value="#2dd4bf" style="height: 40px; padding: 4px;">
      </div>

      <div class="form-group" id="f-folder-parent-group">
        <label>Pertence à pasta? (Subpasta / Mover)</label>
        <select id="f-folder-parent" class="form-control">
          <option value="">Nenhuma (Pasta Principal)</option>
        </select>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px;">
        <button class="btn" style="background: transparent; color: var(--text);" onclick="closeFolderModal()">Cancelar</button>
        <button class="btn" onclick="saveFolder()">Salvar</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(console.error); }

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAvdngV2HMKdAIUmK1f9IF0gm4uEXPdd44",
      authDomain: "fluxo-de-caixa-59dd1.firebaseapp.com",
      projectId: "fluxo-de-caixa-59dd1",
      storageBucket: "fluxo-de-caixa-59dd1.appspot.com",
      messagingSenderId: "837452325692",
      appId: "1:837452325692:web:abb7f33bb167d2c13df439"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    db.enablePersistence().catch(err => console.log("Offline persistence:", err));

    // Estado da Aplicação
    let S = { areas: [], items: [], templates: [] };
    let currentArea = 'all';
    let searchTerm = '';
    let currentEditItemId = null;
    let editingOriginalItem = null;
    let formStarred = false;
    let calendarWeekOffset = 0;
    let longTouchTimer = null;
    let touchMoved = false;
    let blockNextClick = false;
    let blockClickTimer = null;
    let unsubscribeFirestore = null;

    // Preferências em LocalStorage (com Try/Catch)
    let prefs = { collapsedDone: true, viewMode: 'list', descExpanded: {} };
    try {
      const savedPrefs = localStorage.getItem('agenda_prefs_v2');
      if (savedPrefs) prefs = { ...prefs, ...JSON.parse(savedPrefs) };
    } catch(e) { console.warn('LocalStorage error:', e); }

    function savePrefs() {
      try { localStorage.setItem('agenda_prefs_v2', JSON.stringify(prefs)); } catch(e){}
    }

    function generateId(prefix = 'id') {
      return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
    }

    function toLocalDateStr(d) {
      if (!d) return '';
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function compareItemsByDateTime(a, b) {
      const dateA = a.date || '9999-99-99';
      const dateB = b.date || '9999-99-99';
      if (dateA !== dateB) {
        return dateA.localeCompare(dateB);
      }
      const timeA = a.time || '23:59:59';
      const timeB = b.time || '23:59:59';
      return timeA.localeCompare(timeB);
    }

    function filterItems(val) {
      searchTerm = val;
      render();
    }

    // Utilitários de Segurança e Formatação
    function escapeHtml(str) {
      if (typeof str !== 'string') return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function isValidHttpUrl(string) {
      if (!string) return false;
      try {
        const url = new URL(string);
        return url.protocol === "http:" || url.protocol === "https:";
      } catch (_) {
        return false;
      }
    }

    function normalizeAndValidateUrl(urlStr) {
      if (!urlStr) return '';
      let testUrl = urlStr.trim();
      if (!/^https?:\/\//i.test(testUrl)) {
        testUrl = 'https://' + testUrl;
      }
      return isValidHttpUrl(testUrl) ? testUrl : '';
    }

    function getTodayBR() {
      return toLocalDateStr(new Date());
    }

    function formatBR(dStr, tStr) {
      if (!dStr) return '';
      const p = dStr.split('-');
      return `${p[2]}/${p[1]}` + (tStr ? ` às ${tStr}` : '');
    }

    function autoResizeTextarea(el) {
      if (!el) return;
      el.style.height = 'auto';
      el.style.height = Math.max(90, el.scrollHeight) + 'px';
    }

    // Atalhos globais
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
        e.preventDefault(); 
        document.querySelector('.search-input').focus();
      }
      if (e.key === 'Escape') {
        hideContextMenu();
        if (document.getElementById('item-modal').classList.contains('open')) {
          attemptCloseItemModal();
        } else {
          closeFolderModal();
        }
      }
    });

    window.addEventListener('scroll', hideContextMenu);

    // Autenticação
    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('u-avatar').src = user.photoURL || '';
        document.getElementById('u-name').innerText = user.displayName || user.email;
        loadData();
      } else { 
        if (unsubscribeFirestore) {
          unsubscribeFirestore();
          unsubscribeFirestore = null;
        }
        document.getElementById('auth-overlay').style.display = 'flex'; 
      }
    });

    function loginGoogle() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    function logout() { 
      if (unsubscribeFirestore) {
        unsubscribeFirestore();
        unsubscribeFirestore = null;
      }
      auth.signOut(); 
    }

    function loadData() {
      if (unsubscribeFirestore) {
        unsubscribeFirestore();
        unsubscribeFirestore = null;
      }

      unsubscribeFirestore = db.collection('shared').doc('agenda-vida').onSnapshot(doc => {
        if (doc.exists) {
          const raw = doc.data();
          if (raw.json) { try { S = JSON.parse(raw.json); } catch (e) { S = raw; } } else { S = raw; }
        }
        if (!S.items) S.items = [];
        if (!S.areas) S.areas = [];
        if (!S.templates) S.templates = [];

        // Normalização sanitizada de dados legados
        S.items.forEach(i => {
          if (!i.status || i.status === 'UNDEFINED') i.status = 'todo';
        });

        render();
      });
    }

    function saveData() {
      db.collection('shared').doc('agenda-vida').set({ ...S, json: JSON.stringify(S), t: Date.now() });
    }

    function getFolderConfig(id) { return S.areas.find(a => a.id === id); }

    function getHierarchy(id) {
      let folder = getFolderConfig(id);
      if (!folder) return { text: '', color: 'var(--muted)' };
      let color = folder.color || 'var(--muted)';
      if (folder.parentId) {
        let parent = getFolderConfig(folder.parentId);
        if (parent) return { text: `${parent.name} > ${folder.name}`, color: color };
      }
      return { text: folder.name, color: color };
    }

    // Captura Rápida
    function handleQuickCapture(e) { if(e.key === 'Enter') processQuickCapture(); }
    function processQuickCapture() {
      const input = document.getElementById('quick-input');
      let text = input.value.trim();
      if(!text) return;

      const originalText = text;
      let date = getTodayBR();
      let time = '';
      let folderId = currentArea === 'all' ? '' : currentArea;
      let title = text;

      const timeMatch = text.match(/\b([01]?\d|2[0-3])[:h]([0-5]\d)?\b/i);
      if (timeMatch) {
        time = timeMatch[1].padStart(2, '0') + ':' + (timeMatch[2] || '00');
        title = title.replace(timeMatch[0], '');
      }
      if (/amanh[ãa]/i.test(text)) {
        let d = new Date();
        d.setDate(d.getDate() + 1);
        date = toLocalDateStr(d);
        title = title.replace(/amanh[ãa]/i, '');
      }
      const tagMatch = text.match(/#([\p{L}\p{N}_]+)/u);
      if (tagMatch) {
        const fName = tagMatch[1].toLowerCase();
        const found = S.areas.find(a => a.name.toLowerCase().includes(fName));
        if (found) folderId = found.id;
        title = title.replace(tagMatch[0], '');
      }

      title = title.trim();
      if (!title) {
        title = originalText;
      }

      S.items.push({ 
        id: generateId('item'), 
        title: title, 
        date: date, 
        time: time, 
        area: folderId, 
        status: 'todo', 
        rep: 'none',
        checklist: []
      });
      saveData();
      input.value = '';
    }

    // Renderização Geral
    function render() {
      renderSidebar();
      renderHeader();
      
      const container = document.getElementById('items-container');
      container.innerHTML = '';

      let list = S.items.filter(i => {
        if (currentArea === 'all') return true;
        return i.area === currentArea || getFolderConfig(i.area)?.parentId === currentArea;
      });

      if (searchTerm) {
        const term = searchTerm.toLowerCase();
        list = list.filter(i => 
          (i.title && i.title.toLowerCase().includes(term)) || 
          (i.desc && i.desc.toLowerCase().includes(term)) ||
          (i.checklist && i.checklist.some(c => c.text && c.text.toLowerCase().includes(term)))
        );
      }

      if (list.length === 0) {
        if (searchTerm) {
          container.innerHTML = `
            <div class="empty-state">
              <p>Nenhum resultado para '${escapeHtml(searchTerm)}'</p>
            </div>
          `;
        } else if (currentArea !== 'all') {
          container.innerHTML = `
            <div class="empty-state">
              <p>Nenhum item nesta pasta ainda.</p>
              <button class="btn" onclick="openItemModal()">+ Novo item nesta pasta</button>
            </div>
          `;
        }
        return;
      }

      if (prefs.viewMode === 'cards') renderViewCards(list, container);
      else if (prefs.viewMode === 'kanban') renderViewKanban(list, container);
      else if (prefs.viewMode === 'calendar') renderViewCalendar(list, container);
      else renderViewList(list, container);
    }

    function setViewMode(mode) {
      prefs.viewMode = mode;
      savePrefs();
      render();
    }

    function renderSidebar() {
      const c = document.getElementById('folder-tree');
      c.innerHTML = '';
      
      const navAll = document.getElementById('nav-all');
      if (currentArea === 'all') navAll.classList.add('active');
      else navAll.classList.remove('active');

      const mainFolders = S.areas.filter(a => !a.parentId);
      mainFolders.forEach(area => {
        const isSelected = currentArea === area.id;
        const el = document.createElement('div');
        el.className = `nav-item ${isSelected ? 'active' : ''}`;
        el.onclick = () => setArea(area.id);
        el.innerHTML = `
          <span style="display:flex; align-items:center; gap:8px; flex:1; overflow:hidden;">
            <span class="color-dot" style="background:${escapeHtml(area.color||'#ccc')}"></span> 
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(area.name)}</span>
          </span>
          <button class="folder-menu-btn" onclick="toggleFolderMenu('${area.id}', event)">⋮</button>
          <div id="f-menu-${area.id}" class="dropdown">
            <button class="dropdown-item" onclick="openFolderModal('${area.id}'); event.stopPropagation();">+ Subpasta</button>
            <button class="dropdown-item" onclick="editFolder('${area.id}'); event.stopPropagation();">Editar / Mover</button>
            <button class="dropdown-item danger" onclick="deleteFolder('${area.id}'); event.stopPropagation();">Excluir</button>
          </div>
        `;
        c.appendChild(el);

        const subs = S.areas.filter(sub => sub.parentId === area.id);
        subs.forEach(sub => {
          const isSubSelected = currentArea === sub.id;
          const subEl = document.createElement('div');
          subEl.className = `nav-item sub ${isSubSelected ? 'active' : ''}`;
          subEl.onclick = () => setArea(sub.id);
          subEl.innerHTML = `
            <span style="display:flex; align-items:center; gap:6px; flex:1; overflow:hidden;">
              <span class="color-dot" style="background:${escapeHtml(sub.color||'#ccc')}; width:7px; height:7px;"></span> 
              <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(sub.name)}</span>
            </span>
            <button class="folder-menu-btn" onclick="toggleFolderMenu('${sub.id}', event)">⋮</button>
            <div id="f-menu-${sub.id}" class="dropdown">
              <button class="dropdown-item" onclick="editFolder('${sub.id}'); event.stopPropagation();">Editar / Mover</button>
              <button class="dropdown-item danger" onclick="deleteFolder('${sub.id}'); event.stopPropagation();">Excluir</button>
            </div>
          `;
          c.appendChild(subEl);
        });
      });
    }

    function toggleFolderMenu(id, e) {
      if(e) e.stopPropagation();
      document.querySelectorAll('.dropdown').forEach(d => { if(d.id !== `f-menu-${id}`) d.classList.remove('show'); });
      document.getElementById(`f-menu-${id}`)?.classList.toggle('show');
    }

    document.addEventListener('click', (e) => {
      if(!e.target.closest('.folder-menu-btn')) {
        document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
      }
    });

    function renderHeader() {
      const c = document.getElementById('header-container');
      const name = (auth.currentUser?.displayName || 'Usuário').split(' ')[0];
      
      let titleText = `Olá, ${escapeHtml(name)}`;
      if (currentArea !== 'all') {
        const folder = getFolderConfig(currentArea);
        if (folder) titleText = `<span class="color-dot" style="background:${escapeHtml(folder.color||'#ccc')}"></span> ${escapeHtml(folder.name)}`;
      }

      let subchips = '';
      if (currentArea !== 'all') {
        const folder = getFolderConfig(currentArea);
        const parentId = folder?.parentId || currentArea;
        const subfolders = S.areas.filter(a => a.parentId === parentId);
        if (subfolders.length > 0) {
          const parentFolder = getFolderConfig(parentId);
          const related = [parentFolder, ...subfolders].filter(Boolean);
          subchips = `<div class="subfolder-chips">` + related.map(r => `
            <button class="chip ${r.id === currentArea ? 'active' : ''}" onclick="setArea('${r.id}')">
              <span class="color-dot" style="background:${escapeHtml(r.color||'#ccc')}"></span> ${escapeHtml(r.name)}
            </button>`).join('') + `</div>`;
        }
      }

      const activeFolder = getFolderConfig(currentArea);
      const isSubfolderActive = !!(activeFolder && activeFolder.parentId);

      c.innerHTML = `
        <div class="folder-header-area">
          <div class="folder-title">${titleText}</div>
          <div class="folder-actions">
            <div class="view-selector">
              <button class="view-btn ${prefs.viewMode === 'list' ? 'active' : ''}" onclick="setViewMode('list')">📋 Lista</button>
              <button class="view-btn ${prefs.viewMode === 'cards' ? 'active' : ''}" onclick="setViewMode('cards')">🔲 Cards</button>
              <button class="view-btn ${prefs.viewMode === 'kanban' ? 'active' : ''}" onclick="setViewMode('kanban')">📊 Kanban</button>
              <button class="view-btn ${prefs.viewMode === 'calendar' ? 'active' : ''}" onclick="setViewMode('calendar')">📅 Semana</button>
            </div>
            ${(currentArea !== 'all' && !isSubfolderActive) ? `<button class="btn-sm" onclick="openFolderModal('${currentArea}')">+ Subpasta</button>` : ''}
          </div>
          ${subchips}
        </div>
      `;
    }

    // Gerador de Card HTML Reutilizável
    function buildCardHtml(item) {
      const folderInfo = getHierarchy(item.area);
      const isDone = item.status === 'done';
      const today = getTodayBR();
      const isOverdue = !isDone && item.date && item.date < today;

      const statusBadgeHtml = (item.status === 'doing') ? `<span class="badge-status doing">Em andamento</span>` :
                              (item.status === 'waiting') ? `<span class="badge-status waiting">Aguardando</span>` : '';

      let chkText = '';
      if (item.checklist && item.checklist.length > 0) {
        const doneCount = item.checklist.filter(c => c.done).length;
        chkText = `📋 ${doneCount}/${item.checklist.length}`;
      }

      let descHtml = '';
      if (item.desc) {
        const isExp = prefs.descExpanded[item.id];
        const descClass = isExp ? 'card-desc' : 'card-desc collapsed';
        const btnText = isExp ? 'ver menos' : 'ver mais';
        const showBtn = item.desc.length > 120 || item.desc.split('\n').length > 3;
        
        descHtml = `
          <div class="${descClass}">${escapeHtml(item.desc)}</div>
          ${showBtn ? `<button class="btn-toggle-desc" onclick="toggleDescExpand('${item.id}', event)">${btnText}</button>` : ''}
        `;
      }

      const validLink = normalizeAndValidateUrl(item.link);

      return `
        <div class="card ${isDone ? 'status-done' : ''}" 
             style="border-left-color: ${escapeHtml(folderInfo.color)}"
             onclick="handleCardClick('${item.id}', event)"
             oncontextmenu="handleContextMenuEvent(event, '${item.id}')"
             onmouseenter="this.setAttribute('draggable', 'true')"
             ontouchstart="this.removeAttribute('draggable'); handleTouchStart(event, '${item.id}')"
             ontouchmove="handleTouchMove()"
             ontouchend="handleTouchEnd()"
             ondragstart="handleDragStart(event, '${item.id}')">
             
          <div class="card-check ${isDone ? 'done' : ''}" onclick="toggleStatus('${item.id}', event)"></div>
          <div class="card-body">
            <div class="card-title-row">
              <div class="card-title" style="${isDone ? 'text-decoration:line-through;' : ''}">${escapeHtml(item.title)}</div>
              <div style="display:flex; align-items:center; gap:4px;">
                ${item.starred ? '<span style="color:var(--warning); font-size:1.1rem;">★</span>' : ''}
                <button class="item-more-btn" onclick="openMenuFromButton(event, '${item.id}')">⋮</button>
              </div>
            </div>
            
            <div class="card-meta">
              ${item.date ? `<span>📅 ${formatBR(item.date, item.time)}</span>` : ''}
              ${statusBadgeHtml}
              ${folderInfo.text ? `<span>📁 ${escapeHtml(folderInfo.text)}</span>` : ''}
              ${chkText ? `<span>${chkText}</span>` : ''}
              ${validLink ? `<a href="${escapeHtml(validLink)}" target="_blank" onclick="event.stopPropagation()" style="color:var(--accent); text-decoration:none;">🔗 Link</a>` : ''}
              ${isOverdue ? `<button class="postpone-btn" onclick="postponeItem('${item.id}', event)">+1 Dia</button>` : ''}
            </div>

            ${descHtml}
          </div>
        </div>
      `;
    }

    function toggleDescExpand(id, e) {
      if(e) e.stopPropagation();
      prefs.descExpanded[id] = !prefs.descExpanded[id];
      savePrefs();
      render();
    }

    // Visualização 1: Lista com Concluídos Recolhíveis
    function renderViewList(list, c) {
      const today = getTodayBR();
      const periods = {
        overdue: { title: '⚠️ Atrasados', items: [] },
        today: { title: '🔥 Hoje', items: [] },
        next7: { title: '📆 Próximos', items: [] },
        later: { title: '📌 Mais adiante / Sem data', items: [] },
        done: { title: '✅ Concluídos', items: [] }
      };

      list.forEach(item => {
        if (item.status === 'done') periods.done.items.push(item);
        else if (!item.date) periods.later.items.push(item);
        else if (item.date < today) periods.overdue.items.push(item);
        else if (item.date === today) periods.today.items.push(item);
        else periods.next7.items.push(item);
      });

      Object.entries(periods).forEach(([key, period]) => {
        if (period.items.length === 0) return;
        period.items.sort(compareItemsByDateTime);

        const g = document.createElement('div');
        g.className = 'period-group';

        if (key === 'done') {
          const isCollapsed = prefs.collapsedDone;
          const arrow = isCollapsed ? '▸' : '▾';
          g.innerHTML = `
            <div class="period-header collapsible" onclick="toggleDoneCollapse()">
              ${period.title} (${period.items.length}) <span style="font-size:0.9rem;">${arrow}</span>
            </div>
            <div class="period-content" style="display: ${isCollapsed ? 'none' : 'block'}"></div>
          `;
          const contentDiv = g.querySelector('.period-content');
          period.items.forEach(item => contentDiv.innerHTML += buildCardHtml(item));
        } else {
          g.innerHTML = `<div class="period-header">${period.title} (${period.items.length})</div><div class="period-content"></div>`;
          const contentDiv = g.querySelector('.period-content');
          period.items.forEach(item => contentDiv.innerHTML += buildCardHtml(item));
        }

        c.appendChild(g);
      });
    }

    function toggleDoneCollapse() {
      prefs.collapsedDone = !prefs.collapsedDone;
      savePrefs();
      render();
    }

    // Visualização 2: Quadrantes / Cards Grid
    function renderViewCards(list, c) {
      const activeItems = list.filter(i => i.status !== 'done');
      const doneItems = list.filter(i => i.status === 'done');

      const grid = document.createElement('div');
      grid.className = 'grid-cards';
      activeItems.forEach(item => grid.innerHTML += buildCardHtml(item));
      c.appendChild(grid);

      if (doneItems.length > 0) {
        const isCollapsed = prefs.collapsedDone;
        const arrow = isCollapsed ? '▸' : '▾';
        const g = document.createElement('div');
        g.className = 'period-group';
        g.style.marginTop = '28px';
        g.innerHTML = `
          <div class="period-header collapsible" onclick="toggleDoneCollapse()">
            ✅ Concluídos (${doneItems.length}) <span style="font-size:0.9rem;">${arrow}</span>
          </div>
          <div class="period-content grid-cards" style="display: ${isCollapsed ? 'none' : 'grid'}"></div>
        `;
        const contentDiv = g.querySelector('.period-content');
        doneItems.forEach(item => contentDiv.innerHTML += buildCardHtml(item));
        c.appendChild(g);
      }
    }

    // Visualização 3: Kanban (Drag and Drop + Toque)
    function renderViewKanban(list, c) {
      const cols = [
        { id: 'todo', title: 'A Fazer' },
        { id: 'doing', title: 'Em andamento' },
        { id: 'waiting', title: 'Aguardando' },
        { id: 'done', title: 'Concluído' }
      ];

      const board = document.createElement('div');
      board.className = 'kanban-board';

      cols.forEach(col => {
        const colItems = list.filter(i => (i.status || 'todo') === col.id);
        const colEl = document.createElement('div');
        colEl.className = 'kanban-col';
        
        let cardsHtml = '';
        colItems.forEach(item => cardsHtml += buildCardHtml(item));

        colEl.innerHTML = `
          <div class="kanban-header">
            <span>${col.title}</span>
            <span style="background:rgba(255,255,255,0.1); padding:2px 8px; border-radius:10px; font-size:0.75rem;">${colItems.length}</span>
          </div>
          <div class="kanban-cards" 
               ondragover="handleDragOver(event)" 
               ondragleave="handleDragLeave(event)" 
               ondrop="handleDrop(event, '${col.id}')">
            ${cardsHtml}
          </div>
        `;
        board.appendChild(colEl);
      });

      c.appendChild(board);
    }

    let draggedItemId = null;
    function handleDragStart(e, id) { draggedItemId = id; }
    function handleDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
    function handleDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
    function handleDrop(e, targetStatus) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      if (draggedItemId) {
        setItemStatus(draggedItemId, targetStatus);
        draggedItemId = null;
      }
    }

    // Visualização 4: Calendário Semanal com Navegação
    function renderViewCalendar(list, c) {
      const todayStr = getTodayBR();
      const parts = todayStr.split('-').map(Number);
      const baseDate = new Date(parts[0], parts[1] - 1, parts[2]);
      baseDate.setDate(baseDate.getDate() + (calendarWeekOffset * 7));

      const startOfWeek = new Date(baseDate);
      startOfWeek.setDate(baseDate.getDate() - baseDate.getDay());

      const endOfWeek = new Date(startOfWeek);
      endOfWeek.setDate(startOfWeek.getDate() + 6);

      const formatLabel = (d) => `${d.getDate()}/${d.getMonth()+1}`;

      c.innerHTML = `
        <div class="calendar-controls">
          <button class="btn-sm" onclick="navCalendar(-1)">◀ Semana anterior</button>
          <span style="font-weight:bold; font-size:0.9rem;">${formatLabel(startOfWeek)} até ${formatLabel(endOfWeek)}</span>
          <div style="display:flex; gap:6px;">
            <button class="btn-sm" onclick="navCalendar(0)">Hoje</button>
            <button class="btn-sm" onclick="navCalendar(1)">Próxima semana ▶</button>
          </div>
        </div>
        <div class="calendar-scroll-container">
          <div class="calendar-grid" id="cal-grid"></div>
        </div>
      `;

      const grid = document.getElementById('cal-grid');
      const daysOfWeek = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
      
      for(let i=0; i<7; i++) {
        const d = new Date(startOfWeek);
        d.setDate(d.getDate() + i);
        const dStr = toLocalDateStr(d);
        
        const col = document.createElement('div');

        col.innerHTML = `<div class="cal-header" style="${dStr === todayStr ? 'color:var(--accent); font-weight:900;' : ''}">${daysOfWeek[i]} ${d.getDate()}</div>`;
        
        let itemsForDay = list.filter(it => it.date === dStr && it.status !== 'done');
        itemsForDay.sort(compareItemsByDateTime);

        itemsForDay.forEach(item => {
           const folderInfo = getHierarchy(item.area);
           col.innerHTML += `
             <div class="cal-item"

        });

      }
    }

    function navCalendar(dir) {
      if (dir === 0) calendarWeekOffset = 0;
      else calendarWeekOffset += dir;
      render();

    function makeRepSnapshot(item) {
      return {
        title: item.title || '',
        date: item.date || '',
        desc: item.desc || '',
        checklist: (item.checklist || []).map(c => ({ text: c.text, done: !!c.done }))
      };
    }

    function isCopyUntouched(copyItem) {
      if (!copyItem || !copyItem.repSnapshot) return true;
      const snap = copyItem.repSnapshot;

      if ((copyItem.title || '') !== snap.title) return false;
      if ((copyItem.date || '') !== snap.date) return false;
      if ((copyItem.desc || '') !== snap.desc) return false;

      const curChk = copyItem.checklist || [];
      const snapChk = snap.checklist || [];

      if (curChk.length !== snapChk.length) return false;

      for (let i = 0; i < curChk.length; i++) {
        if (curChk[i].text !== snapChk[i].text) return false;
        if (!!curChk[i].done !== !!snapChk[i].done) return false;
      }

      return true;
    }

    function addNextOccurrence(item) {
      if (!item || !item.rep || item.rep === 'none' || !item.date) return;
      const today = getTodayBR();

      let nextDateStr = '';
      const parts = item.date.split('-').map(Number);
      let curYear = parts[0];
      let curMonth = parts[1] - 1;
      let curDay = parts[2];
      const originalRepDay = item.repDay || curDay;

      if (item.rep === 'daily') {
        const baseDateStr = (item.date < today) ? today : item.date;
        const bParts = baseDateStr.split('-').map(Number);
        let d = new Date(bParts[0], bParts[1] - 1, bParts[2]);
        d.setDate(d.getDate() + 1);
        nextDateStr = toLocalDateStr(d);
      } else if (item.rep === 'weekly') {
        let d = new Date(curYear, curMonth, curDay);
        do {
          d.setDate(d.getDate() + 7);
          nextDateStr = toLocalDateStr(d);
        } while (nextDateStr <= today);
      } else if (item.rep === 'monthly') {
        do {
          curMonth++;
          if (curMonth > 11) {
            curMonth = 0;
            curYear++;
          }
          let lastDayOfTarget = new Date(curYear, curMonth + 1, 0).getDate();
          let targetDay = Math.min(originalRepDay, lastDayOfTarget);
          let d = new Date(curYear, curMonth, targetDay);
          nextDateStr = toLocalDateStr(d);
        } while (nextDateStr <= today);
      }

      if (!nextDateStr) return;

      const newItem = {
        ...item,
        id: generateId('item'),
        status: 'todo',
        date: nextDateStr,
        repDay: originalRepDay,
        checklist: (item.checklist || []).map(c => ({ ...c, done: false })),
        repSourceId: item.id
      };

      newItem.repSnapshot = makeRepSnapshot(newItem);
      S.items.push(newItem);
    }

    function removeUntouchedCopy(sourceId) {
      const copyIndex = S.items.findIndex(i => i.repSourceId === sourceId && i.status === 'todo');
      if (copyIndex > -1) {
        const copyItem = S.items[copyIndex];
        if (isCopyUntouched(copyItem)) {
          S.items.splice(copyIndex, 1);
        }
      }
    }

    // Ações do Item e Repetição Inteligente
    function setItemStatus(id, newStatus) {
      const item = S.items.find(i => i.id === id);
      if (!item) return;

      const wasDone = item.status === 'done';
      item.status = newStatus;

      if (newStatus === 'done' && !wasDone) {
        addNextOccurrence(item);
      } else if (wasDone && newStatus !== 'done') {
        removeUntouchedCopy(item.id);
      }

      saveData();
      render();
    }

    function toggleStatus(id, e) {
      if(e) e.stopPropagation();
      const item = S.items.find(i => i.id === id);
      if (!item) return;
      setItemStatus(id, item.status === 'done' ? 'todo' : 'done');
    }

    function postponeItem(id, e) {
      if(e) e.stopPropagation();
      postponeItemByDays(id, 1);
    }

    function postponeItemByDays(id, days) {
      const item = S.items.find(i => i.id === id);
      if(item) {
        const today = getTodayBR();
        let baseDateStr = item.date;
        if (!baseDateStr || baseDateStr < today) {
          baseDateStr = today;
        }
        const parts = baseDateStr.split('-').map(Number);
        let base = new Date(parts[0], parts[1] - 1, parts[2]);
        base.setDate(base.getDate() + days);
        const newDateStr = toLocalDateStr(base);
        item.date = newDateStr;
        item.repDay = parseInt(newDateStr.split('-')[2], 10);
        saveData();
        render();
      }
    }

    function postponeItemToDate(id, targetDate) {
      if (!targetDate) return;
      const item = S.items.find(i => i.id === id);
      if (item) {
        item.date = targetDate;
        item.repDay = parseInt(targetDate.split('-')[2], 10);
        saveData();
        render();
      }
    }

    function getFormState() {
      const chkRows = document.querySelectorAll('#checklist-container .checklist-row');
      const checklist = Array.from(chkRows).map(r => ({
        done: r.querySelector('input[type="checkbox"]').checked,
        text: r.querySelector('.chk-text').value.trim()
      })).filter(c => c.text.length > 0);

      return {
        title: document.getElementById('f-title').value.trim(),
        desc: document.getElementById('f-desc').value,
        area: document.getElementById('f-area').value,
        status: document.getElementById('f-status').value,
        date: document.getElementById('f-date').value,
        time: document.getElementById('f-time').value,
        rep: document.getElementById('f-rep').value,
        link: document.getElementById('f-link').value.trim(),
        starred: formStarred,
        checklist: checklist
      };
    }

    function hasFormChanged() {
      const current = getFormState();
      if (!editingOriginalItem) {
        let defaultArea = (currentArea !== 'all') ? currentArea : '';
        if (defaultArea && !S.areas.some(a => a.id === defaultArea)) {
          defaultArea = '';
        }
        const defaultDate = getTodayBR();
        return current.title !== '' ||
               current.desc !== '' ||
               current.area !== defaultArea ||
               current.status !== 'todo' ||
               current.date !== defaultDate ||
               current.time !== '' ||
               current.rep !== 'none' ||
               current.link !== '' ||
               current.starred !== false ||
               current.checklist.length > 0;
      }

      const orig = editingOriginalItem;
      let origArea = orig.area || '';
      if (origArea && !S.areas.some(a => a.id === origArea)) {
        origArea = '';
      }

      if (current.title !== (orig.title || '')) return true;
      if (current.desc !== (orig.desc || '')) return true;
      if (current.area !== origArea) return true;
      if (current.status !== (orig.status || 'todo')) return true;
      if (current.date !== (orig.date || '')) return true;
      if (current.time !== (orig.time || '')) return true;
      if (current.rep !== (orig.rep || 'none')) return true;
      if (current.link !== (orig.link || '')) return true;
      if (current.starred !== (!!orig.starred)) return true;

      const origChk = orig.checklist || [];
      if (current.checklist.length !== origChk.length) return true;

      for (let i = 0; i < current.checklist.length; i++) {
        if (current.checklist[i].text !== origChk[i].text) return true;
        if (current.checklist[i].done !== !!origChk[i].done) return true;
      }

      return false;
    }

    // Gerenciador de Subitens do Checklist (Enter / Backspace / Colar multi-linhas)
    function addChecklistItem(txt = '', d = false, autoFocus = true, insertAfterRow = null) {
      const container = document.getElementById('checklist-container');
      const row = document.createElement('div');
      row.className = 'checklist-row';
      
      row.innerHTML = `
        <input type="checkbox" ${d ? 'checked' : ''} style="width:18px; height:18px; cursor:pointer;">
        <input type="text" class="form-control chk-text" value="${escapeHtml(txt)}" placeholder="Subitem..." style="padding:8px;">
        <button type="button" class="btn-sm" onclick="this.parentElement.remove()">✕</button>
      `;

      if (insertAfterRow && insertAfterRow.nextSibling) {
        container.insertBefore(row, insertAfterRow.nextSibling);
      } else {
        container.appendChild(row);
      }

      const input = row.querySelector('.chk-text');

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addChecklistItem('', false, true, row);
        } else if (e.key === 'Backspace' && input.value === '') {
          e.preventDefault();
          const prevRow = row.previousElementSibling;
          if (prevRow) {
            const prevInput = prevRow.querySelector('.chk-text');
            row.remove();
            if (prevInput) {
              prevInput.focus();
              prevInput.setSelectionRange(prevInput.value.length, prevInput.value.length);
            }
          }
        }
      });

      input.addEventListener('paste', (e) => {
        const pasteData = (e.clipboardData || window.clipboardData).getData('text');
        if (pasteData && pasteData.includes('\n')) {
          e.preventDefault();
          const lines = pasteData.split('\n').map(l => l.trim()).filter(l => l.length > 0);
          if (lines.length > 0) {
            input.value = lines[0];
            let currentRow = row;
            for (let i = 1; i < lines.length; i++) {
              const newRow = addChecklistItem(lines[i], false, false, currentRow);
              currentRow = newRow;
            }
          }
        }
      });

      if (autoFocus) {
        setTimeout(() => input.focus(), 50);
      }

      return row;
    }

    function saveItem() {
      const title = document.getElementById('f-title').value.trim();
      if (!title) return;

      let rawLink = document.getElementById('f-link').value.trim();
      let validLink = '';

      if (rawLink) {
        const testedUrl = normalizeAndValidateUrl(rawLink);
        if (testedUrl) {
          validLink = testedUrl;
        } else {
          alert('Link inválido. O formato deve ser um endereço de site válido.');
          if (editingOriginalItem && editingOriginalItem.link) {
            validLink = editingOriginalItem.link;
          }
        }
      }

      const chkRows = document.querySelectorAll('#checklist-container .checklist-row');
      const checklist = Array.from(chkRows).map(r => ({
        done: r.querySelector('input[type="checkbox"]').checked,
        text: r.querySelector('.chk-text').value.trim()
      })).filter(c => c.text.length > 0);

      const oldStatus = editingOriginalItem ? (editingOriginalItem.status || 'todo') : null;
      const newStatus = document.getElementById('f-status').value;
      const itemDate = document.getElementById('f-date').value;

      let calculatedRepDay = editingOriginalItem?.repDay || null;
      if (!editingOriginalItem) {
        if (itemDate) {
          calculatedRepDay = parseInt(itemDate.split('-')[2], 10);
        }
      } else {
        if (itemDate !== (editingOriginalItem.date || '')) {
          if (itemDate) {
            calculatedRepDay = parseInt(itemDate.split('-')[2], 10);
          } else {
            calculatedRepDay = null;
          }
        }
      }

      const editedFields = {
        title: title,
        desc: document.getElementById('f-desc').value,
        area: document.getElementById('f-area').value,
        status: newStatus,
        date: itemDate,
        time: document.getElementById('f-time').value,
        rep: document.getElementById('f-rep').value,
        repDay: calculatedRepDay,
        link: validLink,
        starred: formStarred,
        checklist: checklist
      };

      let targetItem = null;

      if (currentEditItemId && editingOriginalItem) {
        const updatedItem = { ...editingOriginalItem, ...editedFields };
        const idx = S.items.findIndex(x => x.id === currentEditItemId);
        if (idx > -1) {
          S.items[idx] = updatedItem;
          targetItem = S.items[idx];
        }
      } else {
        const newItem = {
          id: generateId('item'),
          ...editedFields
        };
        S.items.push(newItem);
        targetItem = newItem;
      }

      if (targetItem) {
        if (oldStatus !== 'done' && newStatus === 'done') {
          addNextOccurrence(targetItem);
        } else if (oldStatus === 'done' && newStatus !== 'done') {
          removeUntouchedCopy(targetItem.id);
        }
      }

      if (document.getElementById('f-save-template').checked) {
        S.templates.push({ 
          id: generateId('tpl'), 
          title: editedFields.title, 
          desc: editedFields.desc, 
          area: editedFields.area, 
          checklist: editedFields.checklist 
        });
      }

      saveData();
      closeItemModal();
      render();
    }

    function openFolderModal(parentId = null) {
      const sParent = document.getElementById('f-folder-parent');
      const mainFolders = S.areas.filter(a => !a.parentId);
      sParent.innerHTML = '<option value="">Nenhuma (Pasta Principal)</option>' + mainFolders.map(a => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('');

      document.getElementById('f-folder-parent-group').style.display = 'block';
      document.getElementById('folder-modal-title').innerText = 'Nova Pasta';
      document.getElementById('f-folder-id').value = '';
      document.getElementById('f-folder-name').value = '';
      document.getElementById('f-folder-color').value = '#2dd4bf';
      document.getElementById('f-folder-parent').value = parentId || '';
      document.getElementById('folder-modal').classList.add('open');
    }

    function editFolder(id) {
      const f = S.areas.find(a => a.id === id);
      if(!f) return;
      
      const hasSubfolders = S.areas.some(a => a.parentId === id);
      const parentGroup = document.getElementById('f-folder-parent-group');

      if (hasSubfolders) {
        parentGroup.style.display = 'none';
      } else {
        parentGroup.style.display = 'block';
        const sParent = document.getElementById('f-folder-parent');
        const allowedParents = S.areas.filter(a => !a.parentId && a.id !== id);
        sParent.innerHTML = '<option value="">Nenhuma (Pasta Principal)</option>' + allowedParents.map(a => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('');
        sParent.value = f.parentId || '';
      }

      document.getElementById('folder-modal-title').innerText = 'Editar / Mover Pasta';
      document.getElementById('f-folder-id').value = f.id;
      document.getElementById('f-folder-name').value = f.name;
      document.getElementById('f-folder-color').value = f.color || '#2dd4bf';
      document.getElementById('folder-modal').classList.add('open');
    }

    function closeFolderModal() { document.getElementById('folder-modal').classList.remove('open'); }
    
    function deleteFolder(id) {
      const subfolders = S.areas.filter(a => a.parentId === id);
      let msg = 'Excluir esta pasta? As tarefas dela ficarão na Agenda Geral.';
      if (subfolders.length > 0) {
        msg = `Excluir esta pasta e as suas ${subfolders.length} subpasta(s)? As tarefas delas ficarão na Agenda Geral.`;
      }

      if(confirm(msg)) {
        const deletedIds = new Set([id, ...subfolders.map(s => s.id)]);

        S.areas = S.areas.filter(a => !deletedIds.has(a.id));

        S.items.forEach(item => {
          if (deletedIds.has(item.area)) {
            item.area = '';
          }
        });

        if(deletedIds.has(currentArea)) {
          currentArea = 'all';
        }
        saveData();
        render();
      }
    }

    function saveFolder() {
      const name = document.getElementById('f-folder-name').value.trim();
      if (!name) return;
      const id = document.getElementById('f-folder-id').value || generateId('area');
      const parentIdVal = document.getElementById('f-folder-parent-group').style.display === 'none' ? 
                          (S.areas.find(a => a.id === id)?.parentId || null) : 
                          (document.getElementById('f-folder-parent').value || null);

      const folderData = {
        id: id, 
        name: name, 
        color: document.getElementById('f-folder-color').value,
        parentId: parentIdVal
      };
      const idx = S.areas.findIndex(a => a.id === id);
      if (idx > -1) S.areas[idx] = folderData; 
      else S.areas.push(folderData);
      
      saveData(); 
      closeFolderModal();
      render();
    }

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
  </script>
</body>
</html>
