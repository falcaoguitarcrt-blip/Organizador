<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Agenda Pro</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2dd4bf">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2360/2360875.png">

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <style>
    :root { 
      --bg: #121820; 
      --card: #1a232e; 
      --border: #2a3646; 
      --accent: #2dd4bf; 
      --accent-hover: #14b8a6; 
      --text: #f1f5f9; 
      --muted: #94a3b8; 
      --danger: #ef4444; 
      --warning: #f59e0b; 
      --purple: #8b5cf6;
      --sidebar-w: 260px; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; }

    /* Scrollbars Finas e Discretas */
    * { scrollbar-width: thin; scrollbar-color: transparent transparent; }
    *:hover { scrollbar-color: var(--border) transparent; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: transparent; border-radius: 4px; }
    *:hover::-webkit-scrollbar-thumb { background: var(--border); }

    /* Auth Overlay */
    #auth-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; }
    .auth-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; text-align: center; max-width: 360px; width: 90%; }
    .btn-google { background: #fff; color: #000; border: 1px solid #dadce0; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 16px; min-height: 44px; }

    /* Layout Principal */
    #sidebar { width: var(--sidebar-w); background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 100; position: fixed; top: 0; bottom: 0; left: 0; }
    #main { flex: 1; margin-left: var(--sidebar-w); padding: 24px; max-width: 1000px; width: 100%; position: relative; }

    @media (max-width: 768px) {
      #sidebar { transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }
      #main { margin-left: 0; padding: 16px; }
      .mobile-nav-toggle { display: block !important; }
    }
    .mobile-nav-toggle { display: none; background: var(--accent); color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; min-height: 40px; }

    /* Perfil */
    .user-profile { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--border); object-fit: cover; }
    .user-info { flex: 1; overflow: hidden; }
    .user-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-logout { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 0.8rem; padding: 4px 0; margin-top: 2px; }

    /* Navegação / Sidebar */
    .nav-group { padding: 12px 8px; flex: 1; overflow-y: auto; }
    .nav-section-title { margin: 16px 8px 6px; font-weight: 700; font-size: 0.75rem; color: var(--muted); display: flex; justify-content: space-between; align-items: center; letter-spacing: 0.5px; }
    .nav-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); margin-bottom: 4px; font-size: 0.95rem; position: relative; user-select: none; min-height: 40px; }
    .nav-item.sub { padding-left: 28px; font-size: 0.9rem; }
    .nav-item:hover { background: rgba(255,255,255,0.03); color: var(--text); }
    .nav-item.active { background: rgba(45, 212, 191, 0.15); color: var(--accent); font-weight: 600; }
    .nav-item.drag-over-folder { border: 2px dashed var(--accent); }

    .chevron-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 2px 6px; font-size: 0.85rem; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
    .folder-menu-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 2px 6px; border-radius: 4px; font-size: 1rem; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
    .folder-menu-btn:hover { color: var(--text); background: rgba(255,255,255,0.1); }
    .folder-badge { background: rgba(255,255,255,0.1); color: var(--muted); font-size: 0.72rem; padding: 2px 6px; border-radius: 10px; font-weight: bold; margin-left: auto; margin-right: 4px; }
    
    /* Dropdown Geral */
    .dropdown { display: none; position: absolute; right: 10px; top: 32px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; z-index: 300; flex-direction: column; box-shadow: 0 8px 20px rgba(0,0,0,0.6); min-width: 170px; }
    .dropdown.show { display: flex; }
    .dropdown-item { padding: 10px 14px; color: var(--text); font-size: 0.85rem; cursor: pointer; text-align: left; background: transparent; border: none; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; }
    .dropdown-item:hover { background: rgba(255,255,255,0.08); }
    .dropdown-item.danger { color: var(--danger); }

    /* Topbar & Captura Rápida */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap;}
    .search-input { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 8px; flex: 1; min-width: 200px; font-size: 0.9rem; }
    .search-input:focus { border-color: var(--accent); outline: none; }
    
    .quick-capture { display: flex; gap: 8px; width: 100%; margin-bottom: 24px; }
    .quick-capture input { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--text); padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; }
    .quick-capture input:focus { border-color: var(--accent); outline: none; }

    /* Banner Atrasados */
    .overdue-banner { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .overdue-banner-text { font-size: 0.9rem; font-weight: 600; color: #fca5a5; }

    /* Agenda Geral Dashboard */
    .dashboard-hero { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 24px; }
    .dashboard-hero h2 { font-size: 1.4rem; margin-bottom: 4px; }
    .dashboard-hero .date-str { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }
    
    .dashboard-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .dash-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 12px; cursor: pointer; text-align: center; transition: all 0.2s; min-height: 70px; }
    .dash-card:hover { border-color: var(--accent); background: rgba(45, 212, 191, 0.05); }
    .dash-card.active { border-color: var(--accent); background: rgba(45, 212, 191, 0.15); }
    .dash-card-num { font-size: 1.4rem; font-weight: bold; margin-bottom: 2px; }
    .dash-card-lbl { font-size: 0.75rem; color: var(--muted); font-weight: 600; }

    .dash-special-block { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .dash-special-title { font-size: 0.85rem; font-weight: bold; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Cabeçalho do Conteúdo */
    .folder-header-area { margin-bottom: 24px; }
    .folder-title { font-size: 1.6rem; font-weight: bold; margin-bottom: 6px; display: flex; align-items: center; gap: 12px; }
    .folder-actions { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .subfolder-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .chip { padding: 6px 12px; background: transparent; border: 1px solid var(--border); border-radius: 20px; font-size: 0.85rem; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 6px; min-height: 36px; }
    .chip:hover { border-color: var(--muted); }
    .chip.active { border-color: var(--accent); background: rgba(45, 212, 191, 0.1); color: var(--accent); font-weight: 600; }
    .color-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

    /* Botões e Segmentados de Visualização */
    .view-selector { display: flex; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
    .view-btn { padding: 8px 12px; border: none; background: transparent; color: var(--muted); font-size: 0.8rem; font-weight: 600; cursor: pointer; border-radius: 6px; display: flex; align-items: center; gap: 6px; min-height: 36px; }
    .view-btn.active { background: var(--card); color: var(--accent); border: 1px solid var(--border); }
    .view-btn:hover:not(.active) { color: var(--text); }

    .btn { background: var(--accent); color: #000; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; }
    .btn:hover { background: var(--accent-hover); }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; }
    .btn-sm:hover { background: rgba(255,255,255,0.05); }

    /* Períodos e Grupos */
    .period-group { margin-bottom: 28px; }
    .period-header { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: 0.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; user-select: none; }
    .period-header.collapsible { cursor: pointer; }
    .period-header.collapsible:hover { color: var(--text); }
    .period-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* Cards e Itens (Lista) */
    .card { 
      background: var(--card); 
      border: 1px solid var(--border); 
      border-left: 4px solid var(--muted); 
      border-radius: 12px; 
      padding: 14px 16px; 
      margin-bottom: 10px; 
      display: flex; 
      gap: 12px; 
      cursor: pointer; 
      position: relative; 
      transition: border-color 0.2s, opacity 0.2s; 
      user-select: text; 
      -webkit-user-select: text;
    }
    .card:hover { border-color: #3b4b5e; }
    .card:hover .card-edit-btn { opacity: 1; }
    .card.status-done { opacity: 0.55; }
    
    .card-drag-handle { cursor: grab; color: var(--muted); font-size: 1.1rem; padding: 0 4px; display: none; align-items: center; }
    .kanban-board .card-drag-handle { display: flex; }
    
    .card-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); cursor: pointer; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .card-check:hover { border-color: var(--accent); }
    .card-check.done { background: var(--accent); border-color: var(--accent); }
    .card-check.done::after { content: '✓'; color: #000; font-size: 13px; font-weight: bold; }
    
    .card-body { flex: 1; overflow: hidden; }
    .card-title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-title { font-weight: 600; margin-bottom: 6px; font-size: 0.98rem; color: #fff; word-break: break-word; }
    .card-meta { font-size: 0.75rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
    
    .card-desc { 
      font-size: 0.85rem; 
      color: var(--muted); 
      margin-top: 8px; 
      white-space: pre-wrap; 
      word-break: break-word; 
      line-height: 1.4; 
    }
    .card-desc.collapsed { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .btn-toggle-desc { background: none; border: none; color: var(--accent); font-size: 0.75rem; cursor: pointer; padding: 2px 0; margin-top: 2px; font-weight: 600; }

    .card-edit-btn { opacity: 0; background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 2px 6px; font-size: 0.9rem; border-radius: 4px; transition: opacity 0.2s; min-height: 32px; min-width: 32px; }
    .card-edit-btn:hover { color: var(--text); background: rgba(255,255,255,0.1); }

    /* Checklist Interativo no Card */
    .card-checklist-box { margin-top: 10px; background: rgba(0,0,0,0.15); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 10px; }
    .card-chk-progress { height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 8px; overflow: hidden; }
    .card-chk-progress-bar { height: 100%; background: var(--accent); transition: width 0.3s ease; }
    .card-chk-progress-bar.complete { background: #10b981; }
    .card-chk-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 0.82rem; }
    .card-chk-item.done span { text-decoration: line-through; opacity: 0.5; }
    .card-chk-add { display: flex; gap: 6px; margin-top: 8px; }
    .card-chk-add input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; color: var(--text); font-size: 0.8rem; }
    .card-chk-add input:focus { border-color: var(--accent); outline: none; }

    /* Selos de Status */
    .badge-status { font-size: 0.68rem; padding: 2px 6px; border-radius: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
    .badge-status.doing { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid var(--warning); }
    .badge-status.waiting { background: rgba(139, 92, 246, 0.15); color: #c4b5fd; border: 1px solid var(--purple); }

    .postpone-btn { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid var(--warning); padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: bold; cursor: pointer; margin-left: auto; min-height: 28px; }
    .postpone-btn:hover { background: rgba(245, 158, 11, 0.3); }

    .item-more-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 2px 6px; font-size: 1.1rem; border-radius: 4px; min-height: 32px; min-width: 32px; }
    .item-more-btn:hover { color: var(--text); background: rgba(255,255,255,0.1); }

    /* Visualização: Cards (Quadrantes Grid) */
    .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .grid-cards .card { flex-direction: column; margin-bottom: 0; justify-content: space-between; }
    .grid-cards .card-body { width: 100%; }

    /* Visualização: Kanban */
    .kanban-board { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 16px; align-items: flex-start; }
    .kanban-col { flex: 1; min-width: 250px; max-width: 320px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 12px; padding: 12px; min-height: 400px; display: flex; flex-direction: column; }
    .kanban-header { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .kanban-cards { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 100px; }
    .kanban-cards.drag-over { background
