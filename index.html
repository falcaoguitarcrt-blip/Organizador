<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Agenda Pro</title>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <style>
    :root {
      --bg: #121820;
      --card: #1a232e;
      --border: #2a3646;
      --accent: #2dd4bf;
      --accent-hover: #14b8a6;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --sidebar-w: 260px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; }

    #auth-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; }
    .auth-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; text-align: center; max-width: 360px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .btn-google { background: #ffffff; color: #000000; border: 1px solid #dadce0; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 16px; }

    #sidebar { width: var(--sidebar-w); background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 100; position: fixed; top: 0; bottom: 0; left: 0; }
    #main { flex: 1; margin-left: var(--sidebar-w); padding: 24px; max-width: 900px; width: 100%; }

    @media (max-width: 768px) {
      #sidebar { transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }
      #main { margin-left: 0; padding: 16px; }
      .mobile-nav-toggle { display: block !important; }
    }

    .mobile-nav-toggle { display: none; background: var(--accent); color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .user-profile { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--border); object-fit: cover; }
    .user-info { flex: 1; overflow: hidden; }
    .user-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-logout { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 0.8rem; padding: 0; margin-top: 2px;}

    .nav-group { padding: 12px 8px; flex: 1; overflow-y: auto; }
    .nav-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); text-decoration: none; margin-bottom: 4px; font-size: 0.95rem; }
    .nav-item:hover, .nav-item.active { background: rgba(45, 212, 191, 0.1); color: var(--accent); }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 12px; }
    .search-input { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; width: 100%; max-width: 300px; }
    
    .period-group { margin-bottom: 32px; }
    .period-header { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: 0.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .period-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: flex-start; gap: 12px; transition: opacity 0.2s; }
    .card:hover { border-color: #3b4b5e; }
    
    .card.status-doing { border-left-color: var(--warning); }
    .card.status-waiting { border-left-color: #8b5cf6; } 
    .card.status-done { border-left-color: var(--accent); opacity: 0.5; }
    
    .card-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); cursor: pointer; flex-shrink: 0; margin-top: 2px; transition: all 0.2s; }
    .card-check:hover { border-color: var(--accent); }
    .card-check.done { background: var(--accent); border-color: var(--accent); }
    
    .card-body { flex: 1; }
    .card-title { font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
    .card-meta { font-size: 0.8rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    
    .badge { font-size: 0.7rem; padding: 3px 6px; border-radius: 4px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); }
    .badge-status { text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }

    .btn { background: var(--accent); color: #000; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: var(--accent-hover); }

    .week-days { display: flex; gap: 6px; margin-top: 8px; }
    .day-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.8rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .day-btn.selected { background: var(--accent); color: #000; border-color: var(--accent); }

    .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(2px); }
    .modal.open { display: flex; }
    .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 90%; max-width: 520px; padding: 28px; max-height: 90vh; overflow-y: auto; }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .form-control { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 8px; outline: none; }
    .form-control:focus { border-color: var(--accent); }

    .checklist-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .btn-sm { padding: 6px 10px; font-size: 0.8rem; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-sm:hover { background: var(--border); }
  </style>
</head>
<body>

  <!-- Tela de Login Google -->
  <div id="auth-overlay">
    <div class="auth-card">
      <h2 style="margin-bottom: 8px;">Minha Agenda Pro</h2>
      <p style="color: var(--muted); font-size: 0.9rem;">Acesse suas tarefas e compromissos sincronizados.</p>
      <button class="btn-google" onclick="loginGoogle()">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
        Entrar com o Google
      </button>
    </div>
  </div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="user-profile">
      <img id="u-avatar" class="user-avatar" src="" alt="Avatar">
      <div class="user-info">
        <div id="u-name" class="user-name">Carregando...</div>
        <button class="btn-logout" onclick="logout()">Sair</button>
      </div>
    </div>
    
    <div class="nav-group">
      <div class="nav-item active" id="nav-all" onclick="setArea('all')">
        <span>📋 Agenda geral</span>
      </div>
      <div style="margin: 20px 8px 8px; font-weight: 700; font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;">Pastas</div>
      <div id="folder-tree"></div>
    </div>
  </div>

  <!-- Principal -->
  <div id="main">
    <div class="top-bar">
      <button class="mobile-nav-toggle" onclick="toggleSidebar()">☰ Menu</button>
      <input type="text" class="search-input" placeholder="Buscar compromissos... (/)" oninput="filterItems(this.value)">
      <button class="btn" onclick="openItemModal()">+ Novo item</button>
    </div>

    <!-- Saudação Dinâmica -->
    <div style="margin-bottom: 28px;">
      <h2 id="greeting-title" style="font-size: 1.6rem; margin-bottom: 4px;">Olá, Felipe</h2>
      <p style="color: var(--muted); font-size: 0.95rem;" id="greeting-sub">Organize seu dia e acompanhe suas tarefas.</p>
    </div>

    <div id="items-container"></div>
  </div>

  <!-- Modal de Item -->
  <div id="item-modal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 20px; font-size: 1.2rem;">Novo Item</h3>
      
      <div class="form-group">
        <label>O que é?</label>
        <input type="text" id="f-title" class="form-control" placeholder="Ex.: Culto de Quinta">
      </div>

      <div class="form-group" style="display: flex; gap: 12px;">
        <div style="flex:1;">
          <label>Pasta</label>
          <select id="f-area" class="form-control"></select>
        </div>
        <div style="flex:1;">
          <label>Situação</label>
          <select id="f-status" class="form-control">
            <option value="todo">A Fazer</option>
            <option value="doing">Em Andamento</option>
            <option value="waiting">Aguardando</option>
            <option value="done">Concluído</option>
          </select>
        </div>
      </div>

      <div class="form-group" style="display: flex; gap: 12px;">
        <div style="flex:1;">
          <label>Data</label>
          <input type="date" id="f-date" class="form-control">
        </div>
        <div style="flex:1;">
          <label>Hora</label>
          <input type="time" id="f-time" class="form-control">
        </div>
      </div>

      <div class="form-group">
        <label>Repetir</label>
        <select id="f-rep" class="form-control" onchange="toggleRepOptions(this.value)">
          <option value="none">Não repete</option>
          <option value="daily">Diariamente</option>
          <option value="weekly">Semanalmente</option>
          <option value="monthly">Mensalmente</option>
        </select>

        <div id="rep-days-box" style="display: none; margin-top: 10px; background: rgba(0,0,0,0.1); padding: 12px; border-radius: 8px;">
          <label style="font-size: 0.78rem;">Dias da semana (complementar):</label>
          <div class="week-days">
            <button type="button" class="day-btn" onclick="toggleDay(this, 'DOM')">D</button>
            <button type="button" class="day-btn" onclick="toggleDay(this, 'SEG')">S</button>
            <button type="button" class="day-btn" onclick="toggleDay(this, 'TER')">T</button>
            <button type="button" class="day-btn" onclick="toggleDay(this, 'QUA')">Q</button>
            <button type="button" class="day-btn" onclick="toggleDay(this, 'QUI')">Q</button>
            <button type="button" class="day-btn" onclick="toggleDay(this, 'SEX')">S</button>
            <button type="button" class="day-btn" onclick="toggleDay(this, 'SAB')">S</button>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Checklist / Subtarefas</label>
        <div id="checklist-container"></div>
        <button type="button" class="btn-sm" style="margin-top: 8px; width: 100%; border-style: dashed;" onclick="addChecklistItem()">+ Adicionar subitem</button>
      </div>

      <div class="form-group" style="border-top: 1px solid var(--border); padding-top: 16px; margin-top: 20px;">
        <label>Anexos</label>
        <input type="url" id="f-link" class="form-control" placeholder="🔗 Adicionar Link (ex: Google Drive, YouTube)" style="margin-bottom: 10px;">
        <input type="file" id="f-file" class="form-control" style="font-size: 0.85rem; padding: 8px;">
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px;">
        <button class="btn" style="background: transparent; color: var(--text);" onclick="closeItemModal()">Cancelar</button>
        <button class="btn" onclick="saveItem()">Salvar Item</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURAÇÃO DO FIREBASE ATUALIZADA
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyAvdngV2HMKdAIUmK1f9IF0gm4uEXPdd44",
      authDomain: "fluxo-de-caixa-59dd1.firebaseapp.com",
      projectId: "fluxo-de-caixa-59dd1",
      storageBucket: "fluxo-de-caixa-59dd1.appspot.com",
      messagingSenderId: "837452325692",
      appId: "1:837452325692:web:abb7f33bb167d2c13df439"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let S = { areas: [], items: [] };
    let currentArea = 'all';
    let selectedDays = [];
    let searchTerm = '';

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('u-avatar').src = user.photoURL || '';
        
        const fullName = user.displayName || user.email;
        const firstName = fullName.split(' ')[0];
        document.getElementById('u-name').innerText = fullName;
        
        const hour = new Date().getHours();
        let greeting = "Boa noite";
        if (hour >= 5 && hour < 12) greeting = "Bom dia";
        else if (hour >= 12 && hour < 18) greeting = "Boa tarde";
        
        document.getElementById('greeting-title').innerText = `${greeting}, ${firstName}`;
        
        loadData();
      } else {
        document.getElementById('auth-overlay').style.display = 'flex';
      }
    });

    function loginGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(e => alert("Erro ao fazer login. Verifique se copiou a chave corretamente. Detalhe: " + e.message));
    }

    function logout() { auth.signOut(); }

    function loadData() {
      db.collection('shared').doc('agenda-vida').onSnapshot(doc => {
        if (doc.exists) {
          S = doc.data();
          if (!S.items) S.items = [];
          if (!S.areas) S.areas = [];
          updateProgress();
          render();
        } else {
          saveData();
        }
      });
    }

    function saveData() {
      db.collection('shared').doc('agenda-vida').set(S);
    }

    function updateProgress() {
      const today = new Date().toISOString().split('T')[0];
      const itemsToday = S.items.filter(i => i.date === today);
      const doneToday = itemsToday.filter(i => i.status === 'done').length;
      const total = itemsToday.length;
      
      let subText = total > 0 
        ? `Você tem ${total} tarefas para hoje (${doneToday} concluídas).` 
        : "Seu dia está livre! Nenhuma tarefa programada para hoje.";
        
      document.getElementById('greeting-sub').innerText = subText;
    }

    function render() {
      renderFolders();
      renderItems();
    }

    function renderFolders() {
      const container = document.getElementById('folder-tree');
      container.innerHTML = '';
      
      const select = document.getElementById('f-area');
      select.innerHTML = '<option value="">(Sem pasta)</option>';

      document.getElementById('nav-all').className = `nav-item ${currentArea === 'all' ? 'active' : ''}`;

      S.areas.forEach(area => {
        const el = document.createElement('div');
        el.className = `nav-item ${currentArea === area.id ? 'active' : ''}`;
        el.innerText = area.name;
        el.onclick = () => setArea(area.id);
        container.appendChild(el);

        const opt = document.createElement('option');
        opt.value = area.id;
        opt.innerText = area.name;
        select.appendChild(opt);
      });
    }

    function renderItems() {
      const container = document.getElementById('items-container');
      container.innerHTML = '';

      let list = S.items.filter(i => currentArea === 'all' || i.area === currentArea);
      
      if (searchTerm) {
        list = list.filter(i => i.title.toLowerCase().includes(searchTerm.toLowerCase()));
      }

      const today = new Date().toISOString().split('T')[0];
      
      const periods = {
        overdue: { title: '⚠️ Atrasados', items: [] },
        today: { title: '📅 Hoje', items: [] },
        next7: { title: '📆 Próximos 7 dias', items: [] },
        later: { title: '📌 Mais adiante / Sem data', items: [] },
        done: { title: '✅ Concluídos', items: [] }
      };

      list.forEach(item => {
        if (item.status === 'done') {
          periods.done.items.push(item);
        } else if (!item.date) {
          periods.later.items.push(item);
        } else if (item.date < today) {
          periods.overdue.items.push(item);
        } else if (item.date === today) {
          periods.today.items.push(item);
        } else {
          const diffTime = Math.abs(new Date(item.date) - new Date(today));
          const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
          if (diffDays <= 7) {
            periods.next7.items.push(item);
          } else {
            periods.later.items.push(item);
          }
        }
      });

      Object.values(periods).forEach(period => {
        if (period.items.length === 0) return;

        period.items.sort((a, b) => (a.date || '9999-99-99').localeCompare(b.date || '9999-99-99'));

        const groupEl = document.createElement('div');
        groupEl.className = 'period-group';
        groupEl.innerHTML = `<div class="period-header">${period.title}</div>`;

        period.items.forEach(item => {
          const card = document.createElement('div');
          card.className = `card status-${item.status || 'todo'}`;
          
          const statusLabels = { todo: 'A Fazer', doing: 'Em Andamento', waiting: 'Aguardando', done: 'Concluído' };
          
          const folderObj = S.areas.find(a => a.id === item.area);
          const folderName = folderObj ? folderObj.name : '';

          card.innerHTML = `
            <div class="card-check ${item.status === 'done' ? 'done' : ''}" onclick="toggleStatus('${item.id}')"></div>
            <div class="card-body">
              <div class="card-title" style="${item.status === 'done' ? 'text-decoration: line-through;' : ''}">${item.title}</div>
              <div class="card-meta">
                ${item.date ? `<span>📅 ${item.date}${item.time || ''}</span>` : ''}
                <span class="badge badge-status">${statusLabels[item.status || 'todo']}</span>
                ${folderName ? `<span class="badge">📁 ${folderName}</span>` : ''}
                ${item.link ? `<a href="${item.link}" target="_blank" style="color:var(--accent); text-decoration:none;" class="badge">🔗 Acessar Link</a>` : ''}
                ${item.checklist && item.checklist.length > 0 ? `<span class="badge">📋 ${item.checklist.filter(c=>c.done).length}/${item.checklist.length}</span>` : ''}
              </div>
            </div>
            <button class="btn-sm" style="background:transparent; border:none; color:var(--muted);" onclick="editItem('${item.id}')">✏️</button>
          `;
          groupEl.appendChild(card);
        });

        container.appendChild(groupEl);
      });
      
      if(container.innerHTML === '') {
        container.innerHTML = '<p style="color:var(--muted); text-align:center; margin-top:40px;">Nenhuma tarefa encontrada.</p>';
      }
    }

    function setArea(id) {
      currentArea = id;
      render();
      if(window.innerWidth <= 768) toggleSidebar();
    }

    function filterItems(val) {
      searchTerm = val;
      renderItems();
    }

    function toggleStatus(id) {
      const item = S.items.find(i => i.id === id);
      if (item) {
        item.status = item.status === 'done' ? 'todo' : 'done';
        saveData();
      }
    }

    function toggleRepOptions(val) {
      document.getElementById('rep-days-box').style.display = val === 'weekly' ? 'block' : 'none';
    }

    function toggleDay(btn, day) {
      btn.classList.toggle('selected');
      if (selectedDays.includes(day)) {
        selectedDays = selectedDays.filter(d => d !== day);
      } else {
        selectedDays.push(day);
      }
    }

    function addChecklistItem(text = '') {
      const container = document.getElementById('checklist-container');
      const row = document.createElement('div');
      row.className = 'checklist-row';
      row.innerHTML = `
        <input type="text" class="form-control" value="${text}" placeholder="Item do checklist..." style="padding:8px 12px; font-size:0.9rem;">
        <button type="button" class="btn-sm" title="Subir" onclick="moveChecklist(this, -1)">▲</button>
        <button type="button" class="btn-sm" title="Descer" onclick="moveChecklist(this, 1)">▼</button>
        <button type="button" class="btn-sm" title="Remover" style="color:var(--danger);" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(row);
    }

    function moveChecklist(btn, dir) {
      const row = btn.parentElement;
      if (dir === -1 && row.previousElementSibling) {
        row.parentElement.insertBefore(row, row.previousElementSibling);
      } else if (dir === 1 && row.nextElementSibling) {
        row.parentElement.insertBefore(row.nextElementSibling, row);
      }
    }

    function openItemModal() {
      document.getElementById('f-title').value = '';
      document.getElementById('f-date').value = '';
      document.getElementById('f-time').value = '';
      document.getElementById('f-status').value = 'todo';
      document.getElementById('f-rep').value = 'none';
      document.getElementById('f-link').value = '';
      document.getElementById('f-file').value = '';
      document.getElementById('checklist-container').innerHTML = '';
      toggleRepOptions('none');
      
      selectedDays = [];
      document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('selected'));

      document.getElementById('item-modal').classList.add('open');
    }

    function closeItemModal() { 
      document.getElementById('item-modal').classList.remove('open'); 
    }

    function saveItem() {
      const title = document.getElementById('f-title').value;
      if (!title) return;

      const checklistInputs = document.querySelectorAll('#checklist-container input');
      const checklist = Array.from(checklistInputs).map(inp => ({ text: inp.value, done: false }));

      const newItem = {
        id: 'item_' + Date.now(),
        title: title,
        area: document.getElementById('f-area').value,
        status: document.getElementById('f-status').value,
        date: document.getElementById('f-date').value,
        time: document.getElementById('f-time').value,
        rep: document.getElementById('f-rep').value,
        repDays: [...selectedDays],
        checklist: checklist,
        link: document.getElementById('f-link').value
      };

      S.items.push(newItem);
      saveData();
      closeItemModal();
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }
  </script>
</body>
</html>
