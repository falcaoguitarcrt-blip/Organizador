<!DOCTYPE html>
<html lang="pt-BR" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=0">
<title>Minha Agenda Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Link do Manifest PWA (Será preenchido dinamicamente pelo JS) -->
<link rel="manifest" id="manifest-link">
<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
:root{--bg:#EEF2F5;--panel:#fff;--ink:#14212E;--mute:#5F6F7E;--line:#D9E1E8;--accent:#0E7C86;--accent-ink:#fff;--danger:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root[data-theme="auto"]{--bg:#0F1720;--panel:#17222E;--ink:#E8EEF3;--mute:#93A3B2;--line:#27384A;--accent:#35B7C2;--accent-ink:#06222A;--danger:#FF8A80}}
:root[data-theme="dark"]{--bg:#0F1720;--panel:#17222E;--ink:#E8EEF3;--mute:#93A3B2;--line:#27384A;--accent:#35B7C2;--accent-ink:#06222A;--danger:#FF8A80}
:root[data-theme="light"]{--bg:#EEF2F5;--panel:#fff;--ink:#14212E;--mute:#5F6F7E;--line:#D9E1E8;--accent:#0E7C86;--accent-ink:#fff;--danger:#B3261E;}

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,-apple-system,sans-serif}
body.no-scroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:flex;min-height:100vh}
aside{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;overflow-y:auto;position:relative}
.close-menu{display:none;position:absolute;top:10px;right:10px;background:none;border:0;font-size:24px;color:var(--mute);padding:4px}
main{flex:1;min-width:0;padding:18px 18px 110px;max-width:760px;margin:0 auto}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;font-weight:500}
.nav:hover{background:var(--bg)}
.nav.on{background:var(--accent);color:var(--accent-ink)}
.nav .n{margin-left:auto;font-size:13px;opacity:.75}
.dot{width:12px;height:12px;border-radius:4px;flex:none}
.sub{margin-left:18px;border-left:2px solid var(--line);padding-left:4px}
.add{color:var(--accent);font-weight:600;margin-top:10px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
h1{font-size:26px;margin:0;font-weight:700;letter-spacing:-.01em}
.menu{display:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;width:40px;height:40px;font-size:20px}
.crumb{color:var(--mute);font-size:14px;margin-bottom:4px}

.fold-btn-toggle{background:none;border:0;color:var(--mute);padding:4px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;border-radius:6px;width:24px;height:24px;margin-right:2px}
.fold-btn-toggle:hover{background:var(--bg);color:var(--ink)}
.tree-item{display:flex;align-items:center;width:100%;gap:2px}

.sync-ind{position:fixed;top:10px;right:10px;background:var(--accent);color:var(--accent-ink);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none}
.sync-ind.show{opacity:1}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.ghost{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px}
.ghost.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
h2{font-size:15px;margin:24px 0 8px;font-weight:700}
h2.late{color:var(--danger)}

.item{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;transition:opacity .2s}
.item.done .t{text-decoration:line-through;color:var(--mute)}
.chk{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid var(--mute);background:none;margin-top:1px;padding:0;color:var(--accent-ink);font-size:14px;line-height:1}
.chk.on{background:var(--accent);border-color:var(--accent)}
.bulk-chk{width:24px;height:24px;flex:none;margin-top:1px;display:none;accent-color:var(--accent)}
.bulk-mode .chk{display:none}
.bulk-mode .bulk-chk{display:block}

.body{flex:1;min-width:0;cursor:pointer}
.t{font-weight:600;overflow-wrap:anywhere}
.meta{font-size:13.5px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.note{font-size:14px;color:var(--mute);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--mute);margin-top:18px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 22px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:5}

.bulk-bar{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;z-index:10;transform:translateY(100%);transition:transform .3s}
.bulk-bar.show{transform:translateY(0)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 12px;font-size:19px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.row{display:flex;gap:10px}.row>div{flex:1}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{flex:1;border:0;border-radius:10px;padding:12px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line);flex:none}
.btn.del{background:none;color:var(--danger);border:1px solid var(--line);flex:none}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:34px;height:34px;border-radius:10px;border:3px solid transparent}
.colors button.on{border-color:var(--ink)}

.pomo-timer{font-size:56px;font-weight:700;text-align:center;margin:24px 0;font-variant-numeric:tabular-nums;color:var(--accent)}

.item.red{border-left:5px solid #D64545}.item.yellow{border-left:5px solid #E0A100}.item.green{border-left:5px solid #2E9E5B}
.star{background:none;border:0;font-size:24px;color:var(--mute);padding:0 2px;align-self:flex-start;line-height:1}.star.on{color:#E0A100}
.pomo-btn{background:none;border:0;font-size:20px;padding:0 4px;margin-left:4px;opacity:0.5} .pomo-btn:hover{opacity:1}

#qa{margin:10px 0 0}
.badge{font-size:12px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 9px;white-space:nowrap}
.hello{color:var(--mute);margin:0 0 4px;text-transform:capitalize}
.lights{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.light{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.light b{display:block;font-size:32px;line-height:1.1}
.light span{font-size:13px;color:var(--mute)}
.light i{display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 6px}

.week{display:flex;gap:6px}
.day{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 0;text-align:center;font-size:12px;color:var(--mute);cursor:pointer;transition:background 0.2s}
.day:hover{background:var(--bg)}
.day b{display:block;font-size:17px;color:var(--ink)}
.day.today{border:2px solid var(--accent)}
.day.active-filter{background:var(--accent);color:var(--accent-ink)}
.day.active-filter b{color:var(--accent-ink)}
.day em{display:block;font-style:normal;font-weight:700;min-height:18px;color:var(--accent)}
.day.active-filter em{color:var(--panel)}

.fold{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.fold .n{margin-left:auto;color:var(--mute);font-size:14px}
.lamp{width:12px;height:12px;border-radius:50%;flex:none}

/* Specific Days Selector & Checklist UI */
.days-selector{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.days-selector label{font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px;background:var(--bg);padding:6px 10px;border-radius:8px;border:1px solid var(--line);cursor:pointer;margin:0}
.days-selector input{width:auto;padding:0}

.checklist-container{margin-top:10px;background:var(--bg);border-radius:10px;padding:10px;border:1px solid var(--line)}
.chk-item{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.chk-item input[type="text"]{padding:6px 10px;font-size:14px;flex:1}
.chk-item input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent)}
.chk-del{background:none;border:0;color:var(--danger);font-size:18px;padding:0 6px}

.progress-bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:width 0.3s}

.attachments-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.att-badge{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);padding:4px 10px;border-radius:8px;font-size:13px;color:var(--ink);text-decoration:none}
.att-badge:hover{border-color:var(--accent)}

@media(max-width:800px){
aside{position:fixed;inset:0 auto 0 0;z-index:15;transform:translateX(-100%);transition:transform .2s;width:min(300px,86vw);padding-top:calc(18px + env(safe-area-inset-top,0px))}
aside.open{transform:none}
.menu{display:block}
.close-menu{display:block}
}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<div id="sync-ind" class="sync-ind">☁ Sincronizando...</div>
<div class="app">
<aside id="side" aria-label="Pastas"></aside>
<main id="main"></main>
</div>
<button class="fab" id="fab">+ Novo item</button>

<div class="bulk-bar" id="bulk-bar">
    <button class="btn" id="bk-done">✅ Concluir</button>
    <button class="btn sec" id="bk-delay">📅 Adiar p/ Hoje</button>
    <button class="btn del" id="bk-del">🗑 Excluir</button>
</div>

<div id="layer"></div><input type="file" id="fi" accept=".json,application/json" hidden>

<script>
// Gerador de PWA Manifest Dinâmico
const manifestJSON = {
  "name": "Minha Agenda Pro",
  "short_name": "Agenda",
  "start_url": window.location.href,
  "display": "standalone",
  "background_color": "#EEF2F5",
  "theme_color": "#0E7C86",
  "icons": [{"src": "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230E7C86' rx='20'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='white'>📅</text></svg>", "sizes": "192x192", "type": "image/svg+xml"}]
};
const blob = new Blob([JSON.stringify(manifestJSON)], {type: 'application/json'});
document.querySelector('#manifest-link').setAttribute('href', URL.createObjectURL(blob));

// Theme Inicial
let currentTheme = localStorage.getItem('agenda-theme') || 'auto';
document.documentElement.setAttribute('data-theme', currentTheme);

// Estado de Pastas Recolhidas
let collapsedFolders = JSON.parse(localStorage.getItem('agenda-collapsed') || '{}');

const firebaseConfig = {
  apiKey: "AIzaSyAvdngV2HMKdAIUmK1f9IF0gm4uEXPdd44",
  authDomain: "fluxo-de-caixa-59dd1.firebaseapp.com",
  projectId: "fluxo-de-caixa-59dd1",
  storageBucket: "fluxo-de-caixa-59dd1.appspot.com",
  messagingSenderId: "367352854109",
  appId: "1:367352854109:web:a6273752e5a7ea891c305e"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection("shared").doc("agenda-vida");

const S_KEY="agenda-vida-v1";
const COLORS=["#0E7C86","#7C5CD6","#D9822B","#2E9E5B","#C2415D","#3B6FD4"];
const seed=()=>({areas:[
{id:"a1",name:"Academia",color:COLORS[3],parent:null,order:0},
{id:"a2",name:"Igreja",color:COLORS[1],parent:null,order:1},
{id:"a3",name:"Minhas funções",color:COLORS[1],parent:"a2",order:0},
{id:"a4",name:"Vida financeira",color:COLORS[2],parent:null,order:2}],items:[]});

let S;
try{S=JSON.parse(localStorage.getItem(S_KEY))}catch(e){S=null}
if(!S||!S.areas)S=seed();

// Garante que todas as áreas tenham ordem
S.areas.forEach((a, i) => { if (a.order === undefined) a.order = i; });
let view = "home";
let showDone=false;
let sq="";
let dayFilter = null;
let bulkMode = false;
let bulkSelection = new Set();
let sortBy = 'date'; 

const push = async () => {
  const ind = document.getElementById('sync-ind');
  if(ind) ind.classList.add('show');
  try {
    await docRef.set({ json: JSON.stringify(S), t: S.t });
  } catch (e) {
    console.error("Erro ao sincronizar", e);
  }
  if(ind) setTimeout(()=>ind.classList.remove('show'), 500);
};

const save=()=>{
  S.t=Date.now();
  try{localStorage.setItem(S_KEY,JSON.stringify(S))}catch(e){}
  clearTimeout(tm);
  tm=setTimeout(push,600);
};

const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayS=()=>iso(new Date());
const tomorrowS=()=>{const d=new Date();d.setDate(d.getDate()+1);return iso(d)};
const fmt=s=>new Date(s+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"short",day:"numeric",month:"short"});

const myAlert = (msg) => {
    sheet(`<h3>Aviso</h3><p>${esc(msg)}</p><div class="acts"><button class="btn" id="btn-ok">OK</button></div>`);
    $("#btn-ok").onclick = close;
};
const myConfirm = (msg, action) => {
    sheet(`<h3>Atenção</h3><p>${esc(msg)}</p><div class="acts"><button class="btn sec" id="btn-no">Cancelar</button><button class="btn del" id="btn-yes">Confirmar</button></div>`);
    $("#btn-no").onclick = close;
    $("#btn-yes").onclick = () => { close(); action(); };
};

const area=id=>S.areas.find(a=>a.id===id);
const kids=id=>S.areas.filter(a=>a.parent===id).sort((a,b)=>((a.order??S.areas.indexOf(a)) - (b.order??S.areas.indexOf(b))));
const family=id=>[id,...kids(id).flatMap(k=>family(k.id))];
const path=id=>{const a=area(id);return a?(a.parent?path(a.parent)+" › ":"")+a.name:"Caixa de entrada"};
const flat=(p=null,d=0)=>kids(p).flatMap(a=>[{a,d},...flat(a.id,d+1)]);
const pending=ids=>S.items.filter(i=>!i.done&&(!ids||ids.includes(i.area))).length;

function moveArea(id, dir) {
    const a = area(id);
    if (!a) return;
    const sibs = kids(a.parent);
    const idx = sibs.findIndex(x => x.id === id);
    if (dir === -1 && idx > 0) {
        const prev = sibs[idx - 1];
        const tempOrder = a.order ?? idx;
        a.order = prev.order ?? (idx - 1);
        prev.order = tempOrder;
    } else if (dir === 1 && idx < sibs.length - 1) {
        const next = sibs[idx + 1];
        const tempOrder = a.order ?? idx;
        a.order = next.order ?? (idx + 1);
        next.order = tempOrder;
    }
    sibs.forEach((item, index) => { item.order = index; });
    save();
    renderSide(); // Atualiza apenas a barra lateral
}

const nextDate = i => {
    let d = new Date((i.date || todayS()) + "T12:00:00");
    const t = todayS();
    if (i.rep === "custom" && Array.isArray(i.repDays) && i.repDays.length > 0) {
        do {
            d.setDate(d.getDate() + 1);
        } while (iso(d) <= t || !i.repDays.includes(d.getDay()));
    } else {
        do {
            if (i.rep === "d") d.setDate(d.getDate() + 1);
            else if (i.rep === "w") d.setDate(d.getDate() + 7);
            else if (i.rep === "m") d.setMonth(d.getMonth() + 1);
        } while (iso(d) <= t);
    }
    return iso(d);
};

let notifsEnabled = localStorage.getItem('agenda-notifs') === '1';
function toggleNotifs() {
    if (!("Notification" in window)) { myAlert("Seu navegador não suporta notificações."); return; }
    if (Notification.permission === "granted") {
        notifsEnabled = !notifsEnabled;
        localStorage.setItem('agenda-notifs', notifsEnabled ? '1' : '0');
        renderSide();
    } else if (Notification.permission !== "denied") {
        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                notifsEnabled = true;
                localStorage.setItem('agenda-notifs', '1');
                renderSide();
            }
        });
    }
}
setInterval(() => {
    if(!notifsEnabled || Notification.permission !== "granted") return;
    const now = new Date();
    const hm = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
    const ts = todayS();
    S.items.forEach(i => {
        if(!i.done && i.date === ts && i.time === hm && !i.notified) {
            new Notification("Agenda: Hora da Tarefa!", { body: i.title });
            i.notified = true; 
        }
    });
}, 60000);

function renderSide(){
 const tree = (p) => kids(p).map(a => {
  const subKids = kids(a.id);
  const hasSub = subKids.length > 0;
  const isCollapsed = collapsedFolders[a.id];
  const toggleBtn = hasSub 
    ? `<button class="fold-btn-toggle" data-toggle-folder="${a.id}" aria-label="Minimizar subpastas">${isCollapsed ? '▶' : '▼'}</button>` 
    : `<span style="width:24px;display:inline-block"></span>`;
  
  return `
   <div class="tree-item">
     ${toggleBtn}
     <button class="nav ${view===a.id?"on":""}" data-go="${a.id}" style="flex:1"><span class="dot" style="background:${a.color}"></span>${esc(a.name)}<span class="n">${pending(family(a.id))||""}</span></button>
   </div>
   ${hasSub && !isCollapsed ? `<div class="sub">${tree(a.id)}</div>` : ''}
  `;
 }).join("");

 const tName = currentTheme === 'auto' ? 'Automático' : (currentTheme === 'dark' ? 'Escuro' : 'Claro');
 $("#side").innerHTML=`
  <button class="close-menu" id="close-menu" aria-label="Fechar">&times;</button>
  <input id="q" type="search" placeholder="Buscar em tudo (/)" value="${esc(sq)}" aria-label="Buscar" style="margin-bottom:10px">
  <button class="nav ${view==="home"?"on":""}" data-go="home"><b>Início</b></button>
  <button class="nav ${view==="agenda"?"on":""}" data-go="agenda"><b>Agenda geral</b><span class="n">${pending()||""}</span></button>
  <h2 style="margin:18px 10px 6px;color:var(--mute);font-size:13px">Pastas</h2>${tree(null)}
  <button class="nav add" data-newfolder="">+ Nova pasta</button>
  <h2 style="margin:18px 10px 6px;color:var(--mute);font-size:13px">Configurações</h2>
  <button class="nav" id="btn-theme">🎨 Tema: ${tName}</button>
  <button class="nav" id="btn-notif">🔔 Notificações: ${notifsEnabled ? 'Ativas' : 'Inativas'}</button>
  <button class="nav" id="bk">⬇ Exportar backup</button>
  <button class="nav" id="im">⬆ Importar backup</button>
  <div class="crumb" style="padding:6px 10px">☁ Sincronizado</div>`;
}

function groups(list){
 const t=todayS(),m=tomorrowS();
 let p=list.filter(i=>!i.done);
 if(sortBy === 'pri') {
    p.sort((a,b)=>(b.pri||0)-(a.pri||0) || ((a.date||"9")+(a.time||"")>(b.date||"9")+(b.time||"")?1:-1));
 } else {
    p.sort((a,b)=>(a.date||"9")+(a.time||"")>(b.date||"9")+(b.time||"")?1:-1);
 }
 return[["Atrasados",p.filter(i=>i.date&&i.date<t),"late"],["Hoje",p.filter(i=>i.date===t)],["Amanhã",p.filter(i=>i.date===m)],["Próximos dias",p.filter(i=>i.date>m)],["Sem data",p.filter(i=>!i.date)]].filter(g=>g[1].length);
}

const urg=i=>{const t=todayS();if(!i.date)return"green";if(i.date<t)return"red";if(i.date===t){const n=new Date(),hm=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");return i.time&&i.time<hm?"red":"yellow"}return i.date===tomorrowS()?"yellow":"green"};

function itemHtml(i,showPath){
 const chkHtml = bulkMode 
    ? `<input type="checkbox" class="bulk-chk" data-bid="${i.id}" ${bulkSelection.has(i.id) ? 'checked' : ''}>`
    : `<button class="chk ${i.done?"on":""}" data-done="${i.id}" aria-label="Concluir">${i.done?"✓":""}</button>`;
 
 const pomoHtml = (i.focus === todayS() && !i.done) ? `<button class="pomo-btn" data-pomo="${i.id}" title="Pomodoro">🍅</button>` : '';

 // Formatting Repetition text
 const repText = {
    d: "diário",
    w: "semanal",
    m: "mensal",
    custom: "dias específicos"
 }[i.rep] || "";

 // Checklist Progress
 let chkProgress = "";
 if (Array.isArray(i.checklist) && i.checklist.length > 0) {
     const doneCnt = i.checklist.filter(c => c.done).length;
     const pct = Math.round((doneCnt / i.checklist.length) * 100);
     chkProgress = `
      <div style="margin-top:6px;font-size:12px;color:var(--mute)">
        ☑ Subtarefas: ${doneCnt}/${i.checklist.length}
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>`;
 }

 // Attachments HTML
 let attHtml = "";
 if (Array.isArray(i.attachments) && i.attachments.length > 0) {
     attHtml = `<div class="attachments-list">` + i.attachments.map(a => `
        <a href="${esc(a.url)}" target="_blank" class="att-badge" onclick="event.stopPropagation()">
            📎 ${esc(a.name)}
        </a>
     `).join("") + `</div>`;
 }

 return`<div class="item ${i.done?"done":urg(i)}" id="item-${i.id}">
  ${chkHtml}
  <div class="body" data-edit="${i.id}">
    <div class="t">${esc(i.title)}${i.doing&&!i.done?` <span class="badge">Em andamento</span>`:""}${i.pri&&!i.done?` <span class="badge" style="background:#D64545;color:#fff">Alta</span>`:""}</div>
    <div class="meta">${i.date?`<span>${fmt(i.date)}${i.time?" às "+i.time:""}</span>`:""}${repText?`<span>↻ ${repText}</span>`:""}${showPath?`<span>${esc(path(i.area))}</span>`:""}</div>
    ${chkProgress}
    ${i.note?`<div class="note">${esc(i.note)}</div>`:""}
    ${attHtml}
  </div>
  ${i.done?"":`<button class="star ${i.focus===todayS()?"on":""}" data-star="${i.id}" aria-label="Foco">★</button>${pomoHtml}`}
</div>`;
}

let pomoInt;
function startPomodoro(id) {
    const it = S.items.find(i=>i.id===id);
    if(!it) return;
    let t = 25 * 60; 
    sheet(`<h3>🍅 Foco: ${esc(it.title)}</h3><div class="pomo-timer" id="p-t">25:00</div><div class="acts"><button class="btn del" id="p-c">Parar</button></div>`);
    clearInterval(pomoInt);
    pomoInt = setInterval(() => {
        t--;
        const m = String(Math.floor(t/60)).padStart(2,'0');
        const s = String(t%60).padStart(2,'0');
        if($('#p-t')) $('#p-t').innerText = `${m}:${s}`;
        if(t<=0) {
            clearInterval(pomoInt);
            if("Notification" in window && Notification.permission === "granted") new Notification("Pomodoro Concluído!", {body: "Hora de uma pausa."});
            myAlert("Tempo esgotado! Bom trabalho.");
        }
    }, 1000);
    $('#p-c').onclick = () => { clearInterval(pomoInt); close(); };
}

 }

 const t=e.target.closest("[data-go],[data-done],[data-edit],[data-newfolder],[data-editfolder],[data-star],[data-pomo],[data-day],#menu,#td,#rv,#bk,#im,#btn-theme,#btn-notif,#btn-bulk,#btn-sort,#clr-day,.bulk-chk,#bk-done,#bk-delay,#bk-del,#close-menu");if(!t)return;
 
 if(t.id==="close-menu") $("#side").classList.remove("open");
 else if(t.dataset.go){view=t.dataset.go;sq="";dayFilter=null;$("#side").classList.remove("open");render();window.scrollTo(0,0)}
 else if(t.dataset.day){dayFilter=t.dataset.day;render();}
 else if(t.id==="clr-day"){dayFilter=null;render();}
 else if(t.id==="btn-theme"){
     currentTheme = currentTheme === 'auto' ? 'light' : (currentTheme === 'light' ? 'dark' : 'auto');
     localStorage.setItem('agenda-theme', currentTheme);
     document.documentElement.setAttribute('data-theme', currentTheme);
     renderSide();
 }
 else if(t.id==="btn-notif") toggleNotifs();
 else if(t.id==="btn-bulk"){ bulkMode = !bulkMode; bulkSelection.clear(); render(); }
 else if(t.classList.contains("bulk-chk")){
     const bid = t.dataset.bid;
     if(t.checked) bulkSelection.add(bid); else bulkSelection.delete(bid);
 }
 else if(t.id==="bk-done"){
     bulkSelection.forEach(id => { const i = S.items.find(x=>x.id===id); if(i) { i.done=true; i.doneAt=todayS(); }});
     bulkMode=false; save(); render();
 }
 else if(t.id==="bk-delay"){
     bulkSelection.forEach(id => { const i = S.items.find(x=>x.id===id); if(i) i.date=todayS(); });
     bulkMode=false; save(); render();
 }
 else if(t.id==="bk-del"){
     myConfirm(`Excluir ${bulkSelection.size} itens selecionados?`, () => {
         S.items = S.items.filter(i => !bulkSelection.has(i.id));
         bulkMode=false; save(); render();
     });
 }
 else if(t.id==="btn-sort"){ sortBy = sortBy === 'date' ? 'pri' : 'date'; render(); }
 else if(t.dataset.pomo) startPomodoro(t.dataset.pomo);
 else if(t.dataset.done){
    const i=S.items.find(x=>x.id===t.dataset.done);
    if(i.rep&&!i.done){i.doneAt=todayS();i.date=nextDate(i);i.focus=null}
    else{i.done=!i.done;i.doneAt=i.done?todayS():null}
    document.getElementById(`item-${i.id}`).classList.toggle('done');
    save(); setTimeout(render, 300);
 }
 else if(t.dataset.star){const i=S.items.find(x=>x.id===t.dataset.star),td=todayS();if(i.focus===td)i.focus=null;else if(S.items.filter(x=>x.focus===td&&!x.done).length>=3){myAlert("O foco do dia tem no máximo 3 itens.");return}else i.focus=td;save();render()}
 else if(t.id==="im")$("#fi").click();
 else if(t.id==="bk"){
  const blob = new Blob([JSON.stringify(S,null,1)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "agenda-backup-"+todayS()+".json"; a.click();
 }
 else if(t.dataset.edit && !bulkMode)itemForm(t.dataset.edit);
 else if(t.dataset.newfolder!==undefined)folderForm(t.dataset.newfolder||null);
 else if(t.dataset.editfolder)folderForm(null,t.dataset.editfolder);
 else if(t.id==="menu")$("#side").classList.add("open");
 else if(t.id==="td"){showDone=!showDone;renderMain()}
});

document.addEventListener("click",e=>{if(!e.target.closest("aside,#menu"))$("#side").classList.remove("open")});
$("#fab").onclick=()=>itemForm();
document.addEventListener("input",e=>{if(e.target.id==="q"){sq=e.target.value;view=sq.trim()?"search":"home";renderMain()}});

document.addEventListener("keydown",e=>{
    const tag = e.target.tagName;
    if(['INPUT','TEXTAREA','SELECT'].includes(tag)) {
        if(e.target.id==="qa"&&e.key==="Enter"){const v=e.target.value.trim();if(!v)return;S.items.push({id:uid(),title:v,area:"",date:"",time:"",note:"",done:false,c:todayS()});save();render();setTimeout(()=>{const q=$("#qa");if(q)q.focus()},0)}
        return;
    }
    if(e.key==="Escape") close();
    if(e.key.toLowerCase()==="n" && !$("#layer").innerHTML) { e.preventDefault(); itemForm(); }
    if(e.key==="/") { e.preventDefault(); $("#q")?.focus(); }
});

$("#fi").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const o=JSON.parse(await f.text());if(!Array.isArray(o.areas)||!Array.isArray(o.items))throw 0; 
  myConfirm("Substituir sua agenda atual por este backup?", () => { S=o;view="home";save();render(); });
}catch(x){myAlert("Arquivo de backup inválido.")}};

docRef.onSnapshot((sn) => {
  if (sn.exists) {
    const r = sn.data();
    if (r && r.json && (r.t || 0) > (S.t || 0)) {
      S = JSON.parse(r.json);
      try { localStorage.setItem(S_KEY, r.json) } catch (e) {}
      render();
    } else if (r && (r.t || 0) < (S.t || 0) - 10000) {
      push();
    }
  } else {
    if (S.t) push();
  }
});
render();
</script>
</body>
</html>
